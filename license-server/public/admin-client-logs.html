<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPTWork 管理 · 客户端运行日志</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body data-admin-page="client-logs">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span>G</span><div><strong>GPTWork</strong><small>Control Center</small></div></div>
    <nav><a href="/admin/overview" data-page="overview">总览</a><a href="/admin/users" data-page="users">用户</a><a href="/admin/plans" data-page="plans">用户配置</a><a href="/admin/orders" data-page="orders">订单</a><a href="/admin/issues" data-page="issues">Issues 讨论区</a><a href="/admin/website" data-page="website">官网管理</a><a href="/admin/settings" data-page="settings">系统配置</a><a href="/admin/client-logs" data-page="client-logs" class="active" aria-current="page">客户端运行日志</a><a href="/admin/server-logs" data-page="server-logs">服务端日志</a><a href="/admin/update" data-page="update">更新</a></nav>
    <button id="logout" class="ghost" hidden>退出管理员</button>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><p>GPTWORK ADMIN · CLIENT-LOGS</p><h1>客户端运行日志</h1></div><span class="security-pill">Account Control</span></header>
    <section id="login" class="card login-card">
      <h2>管理员登录</h2><p class="muted">后台仅使用独立管理员密码。建议通过 HTTPS + WAF / IP 白名单访问。</p>
      <div class="inline"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="loginButton" class="primary">登录</button></div>
      <p id="loginMessage" class="message"></p>
    </section>
    <div id="app" hidden>
      <section id="clientLogs" class="card">
        <div class="section-title">
          <div><h2>客户端运行日志</h2><p class="muted">客户端继续在本机采集脱敏运行日志，并按批次自动上传。服务端默认保留 30 天，可按用户、设备、组件、事件或级别筛选。</p></div>
          <div class="section-actions">
            <input id="clientLogSearch" placeholder="邮箱 / 设备 / 组件 / 事件">
            <select id="clientLogLevel"><option value="">全部级别</option><option value="error">ERROR</option><option value="warn">WARN</option><option value="info">INFO</option><option value="debug">DEBUG</option></select>
            <select id="clientLogLimit"><option value="200">200 条</option><option value="500" selected>500 条</option><option value="1000">1000 条</option><option value="2000">2000 条</option></select>
            <button id="refreshClientLogs">刷新</button><button id="exportClientLogs">导出当前结果</button><button id="clearClientLogs" class="danger">清空当前筛选</button>
          </div>
        </div>
        <p id="clientLogSummary" class="muted">等待读取客户端日志…</p>
        <div class="table-wrap"><table><thead><tr><th>客户端时间</th><th>用户</th><th>设备 / 版本</th><th>级别</th><th>组件</th><th>事件</th><th>详情</th></tr></thead><tbody id="clientLogsBody"></tbody></table></div>
      </section>
    </div>
  </main>
</div>
<script src="/page-cms.js" defer></script>
<script type="module" src="/admin.js"></script>
<script type="module" src="/client-runtime-admin.js"></script>
</body>
</html>
