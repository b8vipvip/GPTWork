<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPTWork 管理 · 服务端日志</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body data-admin-page="server-logs">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span>G</span><div><strong>GPTWork</strong><small>Control Center</small></div></div>
    <nav><a href="/admin/overview" data-page="overview">总览</a><a href="/admin/users" data-page="users">用户</a><a href="/admin/plans" data-page="plans">用户配置</a><a href="/admin/orders" data-page="orders">订单</a><a href="/admin/issues" data-page="issues">Issues 讨论区</a><a href="/admin/website" data-page="website">官网管理</a><a href="/admin/settings" data-page="settings">系统配置</a><a href="/admin/client-logs" data-page="client-logs">客户端运行日志</a><a href="/admin/server-logs" data-page="server-logs" class="active" aria-current="page">服务端日志</a><a href="/admin/update" data-page="update">更新</a></nav>
    <button id="logout" class="ghost" hidden>退出管理员</button>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><p>GPTWORK ADMIN · SERVER-LOGS</p><h1>服务端日志</h1></div><span class="security-pill">Account Control</span></header>
    <section id="login" class="card login-card">
      <h2>管理员登录</h2><p class="muted">后台仅使用独立管理员密码。建议通过 HTTPS + WAF / IP 白名单访问。</p>
      <div class="inline"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="loginButton" class="primary">登录</button></div>
      <p id="loginMessage" class="message"></p>
    </section>
    <div id="app" hidden>
      <section id="logs" class="card">
        <div class="section-title">
          <div><h2>服务端运行日志</h2><p class="muted">敏感密码、验证码、会话令牌不会写入运行日志。导出范围按最新日志向前截取；“全部”导出当前服务端仍保留的全部日志。</p></div>
          <div class="section-actions">
            <button id="refreshRuntime">刷新</button>
            <label>导出最近
              <select id="runtimeExportLimit" aria-label="服务端日志导出范围">
                <option value="200">200 行</option>
                <option value="500" selected>500 行</option>
                <option value="1000">1000 行</option>
                <option value="all">全部</option>
              </select>
            </label>
            <button id="exportRuntimeScoped">导出</button>
          </div>
        </div>
        <p id="runtimeExportMessage" class="message"></p>
        <pre id="runtimeLog" class="logbox">暂无日志</pre>
        <h3>账户审计</h3><pre id="audit" class="logbox">暂无审计</pre>
      </section>
    </div>
  </main>
</div>
<script src="/page-cms.js" defer></script>
<script type="module" src="/admin.js"></script>
<script type="module" src="/client-runtime-admin.js"></script>
</body>
</html>
