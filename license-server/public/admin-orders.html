<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPTWork 管理 · 订单</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body data-admin-page="orders">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span>G</span><div><strong>GPTWork</strong><small>Control Center</small></div></div>
    <nav><a href="/admin/overview" data-page="overview">总览</a><a href="/admin/users" data-page="users">用户</a><a href="/admin/plans" data-page="plans">用户配置</a><a href="/admin/orders" data-page="orders" class="active" aria-current="page">订单</a><a href="/admin/issues" data-page="issues">Issues 讨论区</a><a href="/admin/website" data-page="website">官网管理</a><a href="/admin/settings" data-page="settings">系统配置</a><a href="/admin/client-logs" data-page="client-logs">客户端运行日志</a><a href="/admin/server-logs" data-page="server-logs">服务端日志</a><a href="/admin/update" data-page="update">更新</a></nav>
    <button id="logout" class="ghost" hidden>退出管理员</button>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><p>GPTWORK ADMIN · ORDERS</p><h1>订单</h1></div><span class="security-pill">Account Control</span></header>
    <section id="login" class="card login-card">
      <h2>管理员登录</h2><p class="muted">后台仅使用独立管理员密码。建议通过 HTTPS + WAF / IP 白名单访问。</p>
      <div class="inline"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="loginButton" class="primary">登录</button></div>
      <p id="loginMessage" class="message"></p>
    </section>
    <div id="app" hidden>
      <section id="orders" class="card">
        <div class="section-title"><div><h2>会员订单</h2><p class="muted">微信/支付宝静态收款码：实际到账后由管理员确认开通。USDT：启用 OKX 只读自动核对后，金额、网络/地址、时间窗口与最终充值状态全部满足时会自动标记 paid 并开通；仍保留人工确认作为异常处理入口。</p></div><button id="refreshOrders">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>订单</th><th>用户</th><th>套餐</th><th>支付</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody id="ordersBody"></tbody></table></div>
      </section>
    </div>
  </main>
</div>
<script src="/page-cms.js" defer></script>
<script type="module" src="/admin.js"></script>
</body>
</html>
