name: v05155-apply-fix
on: [push]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.155-work-bootstrap-policy
          fetch-depth: 0
          token: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
      - name: Apply source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('extension/background.js')
          s = p.read_text(encoding='utf-8')
          old = """  getLockConfiguration(tabId) {
            const policy = runtimePolicyForTabSync(tabId);
            return {
              lockedModels: policy.lockedModels,
              allowedReasoningLevels: policy.allowedReasoningLevels,
              preferredReasoning: workBootstrapTabs.has(Number(tabId)) ? null : currentSettings.preferredReasoning,
              preserveModel: false,
              preserveReasoning: workBootstrapTabs.has(Number(tabId)),
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.split('\n'))
          # Build exact source text explicitly to avoid heredoc indentation affecting matching.
          old = (
              "  getLockConfiguration(tabId) {\n"
              "    const policy = runtimePolicyForTabSync(tabId);\n"
              "    return {\n"
              "      lockedModels: policy.lockedModels,\n"
              "      allowedReasoningLevels: policy.allowedReasoningLevels,\n"
              "      preferredReasoning: workBootstrapTabs.has(Number(tabId)) ? null : currentSettings.preferredReasoning,\n"
              "      preserveModel: false,\n"
              "      preserveReasoning: workBootstrapTabs.has(Number(tabId)),\n"
          )
          new = (
              "  getLockConfiguration(tabId) {\n"
              "    const workBootstrap = workBootstrapTabs.has(Number(tabId));\n"
              "    // Verification's one-shot Work bootstrap must use the effective Work policy;\n"
              "    // ordinary traffic and verification transactions keep runtimePolicyForTabSync.\n"
              "    const policy = workBootstrap\n"
              "      ? effectivePolicyForTabSync(tabId)\n"
              "      : runtimePolicyForTabSync(tabId);\n"
              "    return {\n"
              "      lockedModels: policy.lockedModels,\n"
              "      allowedReasoningLevels: policy.allowedReasoningLevels,\n"
              "      preferredReasoning: workBootstrap ? null : currentSettings.preferredReasoning,\n"
              "      preserveModel: false,\n"
              "      preserveReasoning: workBootstrap,\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f'lock block match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old2 = (
              "  const verificationSummary = summarizeVerificationOutcome(catalogVerification);\n"
              "  const finalOutcome = verificationSummary.outcome;\n"
              "  const finalReason = verificationSummary.reason;\n"
          )
          new2 = (
              "  const verificationSummary = summarizeVerificationOutcome(catalogVerification);\n"
              "  let finalOutcome = verificationSummary.outcome;\n"
              "  let finalReason = verificationSummary.reason;\n"
              "  if (\n"
              "    catalogVerification?.workDiscovery?.attempted === true\n"
              "    && catalogVerification.workDiscovery.entered !== true\n"
              "  ) {\n"
              "    finalOutcome = Number(catalogVerification?.verified || 0) > 0 ? 'partial' : 'unverified';\n"
              "    finalReason = 'work_model_discovery_incomplete';\n"
              "  }\n"
          )
          if s.count(old2) != 1:
              raise SystemExit(f'summary block match count={s.count(old2)}')
          s = s.replace(old2, new2, 1)
          if s.count("const RUNTIME_CODE_VERSION = '0.5.154';") != 1:
              raise SystemExit('runtime version match failed')
          s = s.replace("const RUNTIME_CODE_VERSION = '0.5.154';", "const RUNTIME_CODE_VERSION = '0.5.155';", 1)
          p.write_text(s, encoding='utf-8')

          for name in (
              'extension/manifest.json',
              'extension/package.json',
              'native-core/Cargo.toml',
              'native-core/Cargo.lock',
              'packaging/windows/GPTWork.iss',
          ):
              q = Path(name)
              t = q.read_text(encoding='utf-8')
              if '0.5.154' not in t:
                  raise SystemExit(f'{name}: 0.5.154 missing')
              q.write_text(t.replace('0.5.154', '0.5.155'), encoding='utf-8')
          PY
          node --test extension/tests/v05155-work-bootstrap-policy.test.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v05155-apply-fix.yml
          git add extension/background.js extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          git commit -m "v0.5.155: restore Work bootstrap verification policy"
          git push origin HEAD:fix/v0.5.155-work-bootstrap-policy
