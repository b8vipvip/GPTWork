name: v05155-work-bootstrap-patch
on:
  push:
    branches: ["fix/v0.5.155-work-bootstrap-policy"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.155-work-bootstrap-policy
          fetch-depth: 0
      - name: Patch source and versions
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('extension/background.js')
          s = p.read_text()
          old = """    getLockConfiguration(tabId) {
      const policy = runtimePolicyForTabSync(tabId);
      return {
        lockedModels: policy.lockedModels,
        allowedReasoningLevels: policy.allowedReasoningLevels,
        preferredReasoning: workBootstrapTabs.has(Number(tabId)) ? null : currentSettings.preferredReasoning,
        preserveModel: false,
        preserveReasoning: workBootstrapTabs.has(Number(tabId)),
"""
          new = """    getLockConfiguration(tabId) {
      const workBootstrap = workBootstrapTabs.has(Number(tabId));
      // Verification's one-shot Work bootstrap must use the Work/effective policy,
      // while ordinary traffic keeps the page-following request policy.
      const policy = workBootstrap
        ? effectivePolicyForTabSync(tabId)
        : runtimePolicyForTabSync(tabId);
      return {
        lockedModels: policy.lockedModels,
        allowedReasoningLevels: policy.allowedReasoningLevels,
        preferredReasoning: workBootstrap ? null : currentSettings.preferredReasoning,
        preserveModel: false,
        preserveReasoning: workBootstrap,
"""
          if s.count(old) != 1:
              raise SystemExit('lock block mismatch')
          s = s.replace(old, new, 1)
          old2 = """  const verificationSummary = summarizeVerificationOutcome(catalogVerification);
  const finalOutcome = verificationSummary.outcome;
  const finalReason = verificationSummary.reason;
"""
          new2 = """  const verificationSummary = summarizeVerificationOutcome(catalogVerification);
  let finalOutcome = verificationSummary.outcome;
  let finalReason = verificationSummary.reason;
  // Visible-model success is incomplete if the Work transition itself failed.
  if (
    catalogVerification?.workDiscovery?.attempted === true
    && catalogVerification.workDiscovery.entered !== true
  ) {
    finalOutcome = Number(catalogVerification?.verified || 0) > 0 ? 'partial' : 'unverified';
    finalReason = 'work_model_discovery_incomplete';
  }
"""
          if s.count(old2) != 1:
              raise SystemExit('summary block mismatch')
          s = s.replace(old2, new2, 1)
          if s.count("const RUNTIME_CODE_VERSION = '0.5.154';") != 1:
              raise SystemExit('runtime version mismatch')
          s = s.replace("const RUNTIME_CODE_VERSION = '0.5.154';", "const RUNTIME_CODE_VERSION = '0.5.155';", 1)
          p.write_text(s)
          for name in ['extension/manifest.json','extension/package.json','native-core/Cargo.toml','native-core/Cargo.lock','packaging/windows/GPTWork.iss']:
              q = Path(name)
              t = q.read_text()
              if '0.5.154' not in t:
                  raise SystemExit(name + ': old version missing')
              q.write_text(t.replace('0.5.154','0.5.155'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/background.js extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          git commit -m "v0.5.155: restore Work bootstrap verification policy"
          git push origin HEAD:fix/v0.5.155-work-bootstrap-policy
