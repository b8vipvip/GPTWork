name: One-shot user level migration

on:
  push:
    branches:
      - feat/user-levels-rewards-20260910

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[user-levels-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/user-levels-rewards-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize migration patcher assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-user-levels-v1.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("<div class=\"account-meta\">\\n          <span id=\"accountExpiry\">有效期 —</span>\\n          <span id=\"accountUsage\">设备/窗口 —</span>\\n        </div>", "<div class=\"account-meta\">\\n        <span id=\"accountExpiry\">有效期 —</span>\\n        <span id=\"accountUsage\">设备/窗口 —</span>\\n      </div>")
          p.write_text(s, encoding='utf-8')

          a = Path('extension/auth-gate.js')
          t = a.read_text(encoding='utf-8')
          t = t.replace(
            "  accountEmail: $('accountEmail'), accountTier: $('accountTier'), accountExpiry: $('accountExpiry'), accountUsage: $('accountUsage'),\n  accountCenter: $('accountCenter'), accountLogout: $('accountLogout'), enabled: $('enabled'),",
            "  accountEmail: $('accountEmail'), accountTier: $('accountTier'), accountExpiry: $('accountExpiry'), accountUsage: $('accountUsage'), accountCenter: $('accountCenter'), accountLogout: $('accountLogout'),\n  enabled: $('enabled'),"
          )
          t = t.replace(
            "el.accountCenter.addEventListener('click', () => {\n  void chrome.tabs.create({ url: chrome.runtime.getURL('account.html') }).then(() => window.close());\n});",
            "el.accountCenter?.addEventListener('click', () => chrome.tabs.create({ url: chrome.runtime.getURL('account.html') }));"
          )
          a.write_text(t, encoding='utf-8')
          PY
      - name: Apply source migration
        run: python tools/apply-user-levels-v1.py
      - name: Apply post-migration fixes
        run: python tools/post-user-level-fix.py
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension license-server
          git commit -m "feat: finalize user level rewards flow [user-levels-applied]"
          git push origin HEAD:feat/user-levels-rewards-20260910
