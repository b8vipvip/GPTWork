name: stage-v05158-modelpro-redesign

on:
  push:
    branches:
      - fix/v0.5.158-modelpro-v0146-chatgpt-viewtrack

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.5.158 ModelPro migration
        run: node .github/scripts/stage-v05158-modelpro-redesign.cjs
      - name: Validate extension
        working-directory: extension
        run: npm test
      - name: Validate synchronized release surfaces
        shell: bash
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = "0.5.158"
          test "$(node -p "require('./extension/package.json').version")" = "0.5.158"
          grep -q '^version = "0.5.158"' native-core/Cargo.toml
          grep -A1 '^name = "gptwork-core"' native-core/Cargo.lock | grep -q 'version = "0.5.158"'
          grep -q '#define MyAppVersion "0.5.158"' packaging/windows/GPTWork.iss
      - name: Commit staged source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source already staged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          git commit -m "v0.5.158: consume ModelPro v0.1.46 and repair ChatGPT ViewTrack verification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
