name: Account Commerce V2 Patch

on:
  push:
    branches:
      - feat/account-commerce-v2-20260907
    paths:
      - scripts/apply-account-commerce-v2.mjs
      - .github/workflows/account-commerce-v2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[account-commerce-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic source patch
        shell: bash
        run: |
          set +e
          node scripts/apply-account-commerce-v2.mjs
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -q "form-action https:" license-server/payment-system.mjs
            grep -q "original_price_cents" license-server/account-system.mjs
            grep -q "normalizePlanPricing" license-server/site-account.mjs
            grep -q "促销价（元，可选）" license-server/public/admin.js
          fi
          python - <<'PY'
          from pathlib import Path

          p = Path('license-server/public/account.html')
          s = p.read_text()
          old = '<script src="/site.js" defer></script><script src="/page-cms.js" defer></script>'
          new = '<script src="/site.js" defer></script><script type="module" src="/account-commerce.js"></script><script src="/page-cms.js" defer></script>'
          if '/account-commerce.js' not in s:
              if old not in s: raise SystemExit('account.html script anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('extension/account.html')
          s = p.read_text()
          old = '<script type="module" src="account.js"></script>'
          new = old + '\n<script type="module" src="account-commerce.js"></script>'
          if 'account-commerce.js' not in s:
              if old not in s: raise SystemExit('extension account script anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('license-server/package.json')
          s = p.read_text()
          if 'node --check plan-pricing.mjs' not in s:
              s = s.replace('node --check zpay-client.mjs', 'node --check zpay-client.mjs && node --check plan-pricing.mjs', 1)
          if 'node --check public/account-commerce.js' not in s:
              s = s.replace('node --check public/site.js', 'node --check public/site.js && node --check public/account-commerce.js', 1)
          p.write_text(s)

          for helper in [Path('scripts/apply-account-commerce-v2.mjs'), Path('.github/workflows/account-commerce-v2-patch.yml')]:
              if helper.exists(): helper.unlink()
          PY
      - name: Syntax check changed JavaScript
        run: |
          node --check license-server/plan-pricing.mjs
          node --check license-server/public/account-commerce.js
          node --check extension/account-commerce.js
          node --check license-server/account-system.mjs
          node --check license-server/site-account.mjs
          node --check license-server/payment-system.mjs
          node --check license-server/server.mjs
          node --check license-server/public/admin.js
      - name: Commit generated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: redesign account checkout and promotional pricing [account-commerce-v2-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
