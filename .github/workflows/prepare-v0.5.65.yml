name: Prepare v0.5.65

on:
  push:
    branches:
      - release/v0.5.65
    paths:
      - .github/workflows/prepare-v0.5.65.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.65
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Bump release version and notes
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              'extension/manifest.json': [('"version": "0.5.64"', '"version": "0.5.65"')],
              'extension/package.json': [('"version": "0.5.64"', '"version": "0.5.65"')],
              'native-core/Cargo.toml': [('version = "0.5.64"', 'version = "0.5.65"')],
              'native-core/Cargo.lock': [('name = "gptwork-core"\nversion = "0.5.64"', 'name = "gptwork-core"\nversion = "0.5.65"')],
              'packaging/windows/GPTWork.iss': [('#define MyAppVersion "0.5.64"', '#define MyAppVersion "0.5.65"')],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected version marker missing in {name}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          Path('docs/releases/v0.5.65.md').write_text('''# GPTWork v0.5.65\n\n## Update recovery reliability\n\n- Reconciles stale 95% update-recovery errors against live Extension, Native Core, ChatGPT content-runtime, and request-monitor state.\n- Clears an obsolete recovery error only after the target extension and Native Core versions are active and the expected runtime/monitor attachments are healthy.\n- Keeps explicit automatic reload and extension-management guidance when live recovery is still incomplete.\n- Includes the existing update recovery safeguards that restore the master gate and retry runtime recovery after the extension reloads.\n\n## Popup usability\n\n- Makes the account Settings button easier to discover with a stronger blue outline/background, bold label, gear icon, and focus/hover treatment.\n\n## Validation\n\n- Adds regression coverage for stale update-status self-healing and the Settings-button emphasis.\n- Release artifacts remain gated by the standard CI, private-core boundary, store-package, and release workflows.\n''', encoding='utf-8')
      - name: Remove temporary preparation workflow
        run: rm -f .github/workflows/prepare-v0.5.65.yml
      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release v0.5.65"
          git push origin HEAD:release/v0.5.65
