name: Temporary updater recovery patch
on:
  push:
    branches: [fix/update-recovery-core-repair]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-recovery-core-repair
      - name: Patch recovery and repair behavior
        shell: python
        run: |
          from pathlib import Path

          p = Path('extension/background.js')
          s = p.read_text()
          s = s.replace("        await initialize();\n        logRuntime('info', 'native', 'manual_reconnect_completed');", "        await initializeAfterCurrentTask();\n        logRuntime('info', 'native', 'manual_reconnect_completed');")
          s = s.replace("  'GPTWORK_UPDATE_INSTALL',\n]);", "  'GPTWORK_UPDATE_INSTALL',\n  'GPTWORK_CORE_REPAIR',\n]);")
          p.write_text(s)

          p = Path('extension/background-update.js')
          s = p.read_text()
          needle = "async function runtimeReadiness(targetVersion, chromeApi = globalThis.chrome) {"
          helper = """function extensionRequest(message, chromeApi = globalThis.chrome) {\n  return new Promise((resolve, reject) => {\n    try {\n      chromeApi.runtime.sendMessage(message, (response) => {\n        const error = chromeApi.runtime.lastError;\n        if (error) reject(new Error(error.message));\n        else if (response?.ok === false) reject(new Error(response.error || 'Extension request failed'));\n        else resolve(response?.data ?? response ?? null);\n      });\n    } catch (error) {\n      reject(error);\n    }\n  });\n}\n\n"""
          s = s.replace(needle, helper + needle)
          s = s.replace("  if (status?.originalMasterEnabled === true) {\n    await chromeApi.storage.local.set({ [MASTER_KEY]: true });\n  }\n\n  if (status?.originalMasterEnabled !== true)", "  if (status?.originalMasterEnabled === true) {\n    await chromeApi.storage.local.set({ [MASTER_KEY]: true });\n    // The new service worker can begin initialization while the updater's temporary\n    // Master=OFF value is still visible. Force one reconnect after that task settles so\n    // recovery cannot inherit the stale master_disabled initialization.\n    await extensionRequest({ type: 'GPTLOCK_RECONNECT' }, chromeApi).catch((error) => {\n      logUpdate('warn', 'update_reconnect_after_reload_failed', { error: errorText(error) });\n    });\n  }\n\n  if (status?.originalMasterEnabled !== true)")
          s = s.replace("if (!['GPTWORK_UPDATE_STATUS_GET', 'GPTWORK_UPDATE_CHECK', 'GPTWORK_UPDATE_INSTALL'].includes(message.type)) return false;", "if (!['GPTWORK_UPDATE_STATUS_GET', 'GPTWORK_UPDATE_CHECK', 'GPTWORK_UPDATE_INSTALL', 'GPTWORK_CORE_REPAIR'].includes(message.type)) return false;")
          old = """    if (message.type === 'GPTWORK_UPDATE_CHECK') {\n      return checkAndMaybeInstall('ui_check', globalThis.chrome, { force: true, install: false });\n    }\n    return checkAndMaybeInstall('ui_install', globalThis.chrome, { force: true, install: true });"""
          new = """    if (message.type === 'GPTWORK_UPDATE_CHECK') {\n      return checkAndMaybeInstall('ui_check', globalThis.chrome, { force: true, install: false });\n    }\n    if (message.type === 'GPTWORK_CORE_REPAIR') {\n      try {\n        const status = await nativeRequest('get_status', {}, globalThis.chrome, 5_000);\n        logUpdate('info', 'core_repair_existing_install_detected', { nativeVersion: status?.version ?? null });\n        setTimeout(() => globalThis.chrome.runtime.reload(), 150);\n        return { installed: true, nativeVersion: status?.version ?? null, reloadRequested: true };\n      } catch (error) {\n        logUpdate('info', 'core_repair_install_missing', { error: errorText(error) });\n        return { installed: false, error: errorText(error), reloadRequested: false };\n      }\n    }\n    return checkAndMaybeInstall('ui_install', globalThis.chrome, { force: true, install: true });"""
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('extension/popup.js')
          s = p.read_text()
          old = """elements.installCore.addEventListener('click', () => {\n  void chrome.tabs.create({ url: RELEASES_URL }).then(() => window.close());\n});"""
          new = """elements.installCore.addEventListener('click', () => {\n  elements.installCore.disabled = true;\n  elements.message.textContent = '正在检查本机 Core；若已安装将自动重新加载 GPTWork… / Checking local Core…';\n  void sendMessage({ type: 'GPTWORK_CORE_REPAIR' })\n    .then((result) => {\n      if (result?.installed) {\n        elements.message.textContent = `检测到本地 Core${result.nativeVersion ? ` ${result.nativeVersion}` : ''}，正在重新加载 GPTWork 并自动恢复连接…`;\n        setTimeout(() => window.close(), 120);\n        return;\n      }\n      return chrome.tabs.create({ url: RELEASES_URL }).then(() => window.close());\n    })\n    .catch(() => chrome.tabs.create({ url: RELEASES_URL }).then(() => window.close()))\n    .finally(() => { elements.installCore.disabled = false; });\n});"""
          s = s.replace(old, new)
          p.write_text(s)

          # Add regression coverage with source-contract tests, matching this repo's existing style.
          p = Path('extension/tests/update-recovery-core-repair.test.mjs')
          p.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n\nconst background = await readFile(new URL('../background.js', import.meta.url), 'utf8');\nconst updater = await readFile(new URL('../background-update.js', import.meta.url), 'utf8');\nconst popup = await readFile(new URL('../popup.js', import.meta.url), 'utf8');\n\ntest('manual reconnect waits for an in-flight initialization before retrying', () => {\n  assert.match(background, /case 'GPTLOCK_RECONNECT':[\\s\\S]*await initializeAfterCurrentTask\\(\\)/);\n});\n\ntest('post-update recovery explicitly reconnects after restoring Master', () => {\n  assert.match(updater, /update_reconnect_after_reload_failed/);\n  assert.match(updater, /extensionRequest\\(\\{ type: 'GPTLOCK_RECONNECT' \\}/);\n});\n\ntest('core repair checks an existing native install before opening the installer', () => {\n  assert.match(updater, /GPTWORK_CORE_REPAIR/);\n  assert.match(updater, /core_repair_existing_install_detected/);\n  assert.match(popup, /sendMessage\\(\\{ type: 'GPTWORK_CORE_REPAIR' \\}\\)/);\n  assert.match(popup, /if \\(result\\?\\.installed\\)/);\n});\n""")
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-core-recovery-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/background.js extension/background-update.js extension/popup.js extension/tests/update-recovery-core-repair.test.mjs .github/workflows/tmp-core-recovery-fix.yml
          git commit -m "fix: recover core after updater reload"
          git push origin HEAD:fix/update-recovery-core-repair
