name: v0.5.154 auto verification single-flight patch

on:
  push:
    branches:
      - fix/v0.5.154-auto-verify-single-flight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.154-auto-verify-single-flight
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply v0.5.154 single-flight fix
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          bg = Path('extension/background.js')
          text = bg.read_text(encoding='utf-8')
          text = text.replace("const RUNTIME_CODE_VERSION = '0.5.153';", "const RUNTIME_CODE_VERSION = '0.5.154';", 1)

          map_anchor = "const verificationTransactions = new Map();\n"
          map_insert = map_anchor + "// Automatic model verification is single-flight per tab. The task is registered\n// before autoVerify() reaches its first await, so duplicate popup/manual starts join\n// the same browser transaction instead of racing the picker and Composer.\nconst autoVerificationTasks = new Map();\n"
          if 'const autoVerificationTasks = new Map();' not in text:
              if map_anchor not in text:
                  raise SystemExit('verificationTransactions anchor missing')
              text = text.replace(map_anchor, map_insert, 1)

          old_case = """      case 'GPTLOCK_AUTO_VERIFY': {
        const tabId = await chatGptTabId(Number.isInteger(message.tabId) ? message.tabId : null);
        if (tabId === null) throw new Error('No ChatGPT tab / 没有打开的 ChatGPT 标签页');
        const state = tabStates.get(tabId);
        if (!state || !accountAllowsState(state)) throw new Error('当前账号没有有效权益');
        return autoVerify(tabId);
      }"""
          new_case = """      case 'GPTLOCK_AUTO_VERIFY': {
        const tabId = await chatGptTabId(Number.isInteger(message.tabId) ? message.tabId : null);
        if (tabId === null) throw new Error('No ChatGPT tab / 没有打开的 ChatGPT 标签页');
        const state = tabStates.get(tabId);
        if (!state || !accountAllowsState(state)) throw new Error('当前账号没有有效权益');
        const existingTask = autoVerificationTasks.get(tabId);
        if (existingTask) {
          logRuntime('info', 'verification', 'auto_verify_duplicate_joined', {
            tabId,
            running: Boolean(state.autoVerification?.running),
          });
          return existingTask;
        }
        const task = autoVerify(tabId);
        autoVerificationTasks.set(tabId, task);
        try {
          return await task;
        } finally {
          if (autoVerificationTasks.get(tabId) === task) autoVerificationTasks.delete(tabId);
        }
      }"""
          if old_case not in text:
              raise SystemExit('GPTLOCK_AUTO_VERIFY router block missing')
          text = text.replace(old_case, new_case, 1)
          bg.write_text(text, encoding='utf-8')

          replace_one('extension/manifest.json', '"version": "0.5.153"', '"version": "0.5.154"')
          replace_one('extension/package.json', '"version": "0.5.153"', '"version": "0.5.154"')
          replace_one('native-core/Cargo.toml', 'version = "0.5.153"', 'version = "0.5.154"')
          replace_one('native-core/Cargo.lock', 'name = "gptwork-core"\nversion = "0.5.153"', 'name = "gptwork-core"\nversion = "0.5.154"')
          replace_one('packaging/windows/GPTWork.iss', '#define MyAppVersion "0.5.153"', '#define MyAppVersion "0.5.154"')

          test = Path('extension/tests/v05154-auto-verify-single-flight.test.mjs')
          test.write_text("""import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import test from 'node:test';

const background = await readFile(new URL('../background.js', import.meta.url), 'utf8');

test('v0.5.154 serializes automatic model verification per ChatGPT tab', () => {
  assert.match(background, /const autoVerificationTasks = new Map\\(\\)/);
  const start = background.indexOf(\"case 'GPTLOCK_AUTO_VERIFY'\");
  const end = background.indexOf(\"case 'GPTLOCK_SEND_BLOCKED'\", start);
  assert.ok(start >= 0 && end > start);
  const block = background.slice(start, end);
  assert.match(block, /autoVerificationTasks\\.get\\(tabId\\)/);
  assert.match(block, /auto_verify_duplicate_joined/);
  assert.match(block, /const task = autoVerify\\(tabId\\)/);
  assert.match(block, /autoVerificationTasks\\.set\\(tabId, task\\)/);
  assert.match(block, /return await task/);
  assert.match(block, /autoVerificationTasks\\.get\\(tabId\\) === task/);
  assert.match(block, /autoVerificationTasks\\.delete\\(tabId\\)/);
});

test('v0.5.154 keeps the task registration outside autoVerify first-await race window', () => {
  const routerStart = background.indexOf(\"case 'GPTLOCK_AUTO_VERIFY'\");
  const routerEnd = background.indexOf(\"case 'GPTLOCK_SEND_BLOCKED'\", routerStart);
  const block = background.slice(routerStart, routerEnd);
  const createAt = block.indexOf('const task = autoVerify(tabId)');
  const setAt = block.indexOf('autoVerificationTasks.set(tabId, task)');
  const awaitAt = block.indexOf('return await task');
  assert.ok(createAt >= 0 && setAt > createAt && awaitAt > setAt);
});
""", encoding='utf-8')

      - name: Run regression test
        run: cd extension && node --test tests/v05154-auto-verify-single-flight.test.mjs

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/v05154-auto-verify-single-flight-patch.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.5.154: serialize automatic verification per tab"
          git push origin HEAD:fix/v0.5.154-auto-verify-single-flight
