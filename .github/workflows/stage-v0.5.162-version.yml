name: Stage v0.5.162 release version

on:
  push:
    branches:
      - fix/v0.5.162-live-log-resilience

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump release surfaces to v0.5.162
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          for filename in ['extension/package.json', 'extension/manifest.json']:
              p = Path(filename)
              data = json.loads(p.read_text(encoding='utf-8'))
              if data.get('version') != '0.5.161':
                  raise SystemExit(f'{filename}: unexpected version {data.get("version")}')
              data['version'] = '0.5.162'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once('extension/background.js', "const RUNTIME_CODE_VERSION = '0.5.161';", "const RUNTIME_CODE_VERSION = '0.5.162';", 'background version')
          replace_once('native-core/Cargo.toml', 'version = "0.5.161"', 'version = "0.5.162"', 'Cargo.toml version')
          replace_once('native-core/Cargo.lock', 'name = "gptwork-core"\nversion = "0.5.161"', 'name = "gptwork-core"\nversion = "0.5.162"', 'Cargo.lock version')
          replace_once('packaging/windows/GPTWork.iss', '#define MyAppVersion "0.5.161"', '#define MyAppVersion "0.5.162"', 'installer version')

          Path('.github/workflows/stage-v0.5.162-version.yml').unlink()

      - name: Run focused regression tests
        working-directory: extension
        run: |
          node --test tests/v05162-live-log-resilience.test.mjs tests/modelpro-v0145-policy-consumer.test.mjs tests/v05160-modelpro-v0148-causal-viewtrack.test.mjs

      - name: Commit staged release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.5.162: stage live-log resilience release [stage-done]"
          git push
