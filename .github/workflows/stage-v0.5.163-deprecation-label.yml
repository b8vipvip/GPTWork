name: Stage v0.5.163 deprecation-label compatibility
on:
  push:
    branches:
      - fix/v0.5.163-deprecation-label-model-row
permissions:
  contents: write
jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply ModelPro v0.1.49 label compatibility and stage v0.5.163
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          content = Path('extension/content.js')
          s = content.read_text(encoding='utf-8')
          old = "    const explicit = compact.match(/gpt-?(\\d+(?:\\.\\d+)*)(?:-([a-z0-9]+(?:-[a-z0-9]+)*))?/);"
          new = '''    // ChatGPT may append lifecycle/deprecation copy to a model row (for example,
              // "GPT-5.5 Leaving on October 14"). Only known model-family suffixes belong
              // to the canonical model id; trailing UI copy must not become part of the id.
              const explicit = compact.match(/gpt-?(\\d+(?:\\.\\d+)*)(?:-(astra|sol|terra|luna|pro))?\\b/);'''
          if old not in s:
              raise SystemExit('normalizeDisplayedModel target not found')
          content.write_text(s.replace(old, new, 1), encoding='utf-8')

          simple = {
              'extension/package.json': ('"version": "0.5.162"', '"version": "0.5.163"'),
              'extension/manifest.json': ('"version": "0.5.162"', '"version": "0.5.163"'),
              'extension/background.js': ("const RUNTIME_CODE_VERSION = '0.5.162';", "const RUNTIME_CODE_VERSION = '0.5.163';"),
              'native-core/Cargo.toml': ('version = "0.5.162"', 'version = "0.5.163"'),
              'packaging/windows/GPTWork.iss': ('#define MyAppVersion "0.5.162"', '#define MyAppVersion "0.5.163"'),
          }
          for path, (a, b) in simple.items():
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              if a not in t:
                  raise SystemExit(f'version target not found in {path}')
              p.write_text(t.replace(a, b, 1), encoding='utf-8')

          lock = Path('native-core/Cargo.lock')
          t = lock.read_text(encoding='utf-8')
          pattern = r'(name = "gptwork-core"\nversion = ")0\.5\.162(")'
          t2, n = re.subn(pattern, r'\g<1>0.5.163\g<2>', t, count=1)
          if n != 1:
              raise SystemExit('gptwork-core Cargo.lock version target not found')
          lock.write_text(t2, encoding='utf-8')

          test = Path('extension/tests/v05163-deprecation-label-model-row.test.mjs')
          test.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const source = readFileSync(new URL('../content.js', import.meta.url), 'utf8');
          const manifest = JSON.parse(readFileSync(new URL('../manifest.json', import.meta.url), 'utf8'));
          const pkg = JSON.parse(readFileSync(new URL('../package.json', import.meta.url), 'utf8'));
          const background = readFileSync(new URL('../background.js', import.meta.url), 'utf8');
          const installer = readFileSync(new URL('../../packaging/windows/GPTWork.iss', import.meta.url), 'utf8');

          const start = source.indexOf('function normalizeDisplayedModel(text)');
          const end = source.indexOf('\n  function ', start + 1);
          assert.ok(start >= 0 && end > start, 'normalizeDisplayedModel must remain extractable');
          const fnSource = source.slice(start, end);
          const normalizeDisplayedModel = Function(`${fnSource}; return normalizeDisplayedModel;`)();

          test('v0.5.163 keeps ChatGPT deprecation copy out of the canonical model id', () => {
            assert.equal(normalizeDisplayedModel('GPT-5.5 Leaving on October 14'), 'gpt-5.5');
            assert.equal(normalizeDisplayedModel('GPT-5.5'), 'gpt-5.5');
            assert.equal(normalizeDisplayedModel('GPT-5.6 Sol'), 'gpt-5.6-sol');
            assert.equal(normalizeDisplayedModel('GPT-6 Astra'), 'gpt-6-astra');
          });

          test('v0.5.163 release surfaces stay synchronized', () => {
            assert.equal(manifest.version, '0.5.163');
            assert.equal(pkg.version, manifest.version);
            assert.match(background, /const RUNTIME_CODE_VERSION = '0\.5\.163';/);
            assert.match(installer, /#define MyAppVersion "0\.5\.163"/);
          });

          test('deprecation-label compatibility is narrow and keeps the exact default Chat pair contract', () => {
            const helperStart = source.indexOf('function defaultChatDirectModelRows(picker, { requireInteraction = true } = {})');
            const helperEnd = source.indexOf('function advancedPickerView(picker)', helperStart);
            assert.ok(helperStart >= 0 && helperEnd > helperStart);
            const helper = source.slice(helperStart, helperEnd);
            assert.match(helper, /semanticRows\.filter\(interactionVisible\)/);
            assert.match(helper, /models\.has\('gpt-5\.5'\)/);
            assert.match(helper, /models\.has\('gpt-5\.6-sol'\)/);
          });
          ''', encoding='utf-8')

          Path('.github/workflows/stage-v0.5.163-deprecation-label.yml').unlink()
          PY
      - name: Run extension regression suite
        working-directory: extension
        run: npm test
      - name: Commit staged release patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.5.163: tolerate lifecycle copy in model rows [stage-done]"
          git push origin HEAD:fix/v0.5.163-deprecation-label-model-row
