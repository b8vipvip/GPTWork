name: Repair v0.5.161 regression expectations

on:
  push:
    branches:
      - fix/v0.5.161-network-work-astra-floor
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-v05161-regressions
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[regression-repair-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update historical regression expectations
        shell: python
        run: |
          from pathlib import Path

          p = Path('extension/tests/model-auto-lock.test.mjs')
          text = p.read_text(encoding='utf-8')
          old = 'assert.match(runtime, /filter\\(isAtLeastSol\\)/);'
          new = 'assert.match(runtime, /filter\\(isAtLeastWorkFloor\\)/);'
          if old not in text:
              raise SystemExit('model-auto-lock old Work-floor assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('extension/tests/model-verification-authority-ui.test.mjs')
          text = p.read_text(encoding='utf-8')
          old_source = "assert.match(background, /source: 'work_bootstrap_transaction'/);"
          if text.count(old_source) != 2:
              raise SystemExit(f'expected 2 old bootstrap source assertions, got {text.count(old_source)}')
          text = text.replace(old_source, "assert.match(background, /source: 'network_work_(?:policy|transport)'/);")
          replacements = {
              "assert.match(background, /function beginWorkBootstrapTransaction\\(tabId, source\\)/);": "assert.doesNotMatch(background, /function beginWorkBootstrapTransaction\\(tabId, source\\)/);",
              "assert.match(background, /function endWorkBootstrapTransaction\\(tabId, previous\\)/);": "assert.doesNotMatch(background, /function endWorkBootstrapTransaction\\(tabId, previous\\)/);",
              "assert.match(background, /function reacquirePickerBForModel|async function reacquirePickerBForModel/);": "assert.doesNotMatch(background, /function reacquirePickerBForModel|async function reacquirePickerBForModel/);",
              "assert.match(background, /verification_work_activation_turn_started/);": "assert.doesNotMatch(background, /verification_work_activation_turn_started/);",
              "assert.match(background, /normal_work_turn_picker_b_observed/);": "assert.doesNotMatch(background, /normal_work_turn_picker_b_observed/);",
              "assert.match(background, /picker_b_selection_settled_before_probe/);": "assert.doesNotMatch(background, /picker_b_selection_settled_before_probe/);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing authority-ui assertion: {old}')
              text = text.replace(old, new, 1)
          marker = "  assert.doesNotMatch(background, /verification_sol_picker_b_unlock_started/);"
          if marker not in text:
              raise SystemExit('authority-ui lifecycle marker not found')
          text = text.replace(marker, marker + "\n  assert.match(background, /reason: 'network_work_catalog_seeded'/);\n  assert.match(background, /source: 'network_work_transport'/);", 1)
          p.write_text(text, encoding='utf-8')

          p = Path('extension/tests/modelpro-v0144-redesign-sync.test.mjs')
          text = p.read_text(encoding='utf-8')
          old = "  assert.match(background, /normal_work_turn_work_profile_confirmed_by_default_model/);\n  assert.match(background, /activationDefaultModel === activationTarget/);"
          new = "  assert.match(background, /network_work_catalog_seeded/);\n  assert.match(background, /source: 'network_work_transport'/);"
          if old not in text:
              raise SystemExit('ModelPro v0.1.44 retired native-Work assertions not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/repair-v05161-regressions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align v0.5.161 network Work regressions [regression-repair-done]'
          git push origin HEAD:fix/v0.5.161-network-work-astra-floor
