name: One-shot user level syntax repair

on:
  push:
    branches:
      - feat/user-levels-rewards-20260910

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[level-syntax-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/user-levels-rewards-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Repair escaped newlines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('license-server/public/admin.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("(plan.benefits || []).join('\n');", "(plan.benefits || []).join('\\n');")
          s = s.replace("benefits.value.split(/\n?\n/)", "benefits.value.split(/\\r?\\n/)")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Check license server JavaScript
        run: npm --prefix license-server run check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add license-server/public/admin.js
          git commit -m "fix: repair user level admin syntax [level-syntax-fixed]"
          git push origin HEAD:feat/user-levels-rewards-20260910
