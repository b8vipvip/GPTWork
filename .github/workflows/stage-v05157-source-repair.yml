name: stage-v05157-source-repair

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v0.5.157-work-bootstrap-transaction-authority
    paths:
      - .github/workflows/stage-v05157-source-repair.yml

permissions:
  contents: write

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.157-work-bootstrap-transaction-authority
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Normalize deterministic repair anchor
        shell: bash
        run: |
          sed -i "s/'        workBootstrapTabs.add(Number(tabId));'/'workBootstrapTabs.add(Number(tabId));'/" .github/scripts/repair-v05157-work-bootstrap.cjs

      - name: Apply single-authority Work bootstrap repair
        run: node .github/scripts/repair-v05157-work-bootstrap.cjs

      - name: Stage v0.5.157 release surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'non-unique version anchor in {path}: {old!r}')
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if new not in text:
                  raise SystemExit(f'missing version anchor in {path}: {old!r} / {new!r}')

          replace_once('extension/manifest.json', '"version": "0.5.156"', '"version": "0.5.157"')
          replace_once('extension/package.json', '"version": "0.5.156"', '"version": "0.5.157"')
          replace_once('native-core/Cargo.toml', 'version = "0.5.156"', 'version = "0.5.157"')
          replace_once('packaging/windows/GPTWork.iss', '#define MyAppVersion "0.5.156"', '#define MyAppVersion "0.5.157"')

          lock = Path('native-core/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          old = 'name = "gptwork-core"\nversion = "0.5.156"'
          new = 'name = "gptwork-core"\nversion = "0.5.157"'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('non-unique gptwork-core Cargo.lock anchor')
              lock.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('missing gptwork-core Cargo.lock version anchor')
          PY

      - name: Validate repaired source
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail
          node --check background.js
          node --test tests/v05155-work-bootstrap-policy.test.mjs tests/v05156-work-bootstrap-force.test.mjs tests/v05157-work-bootstrap-transaction-authority.test.mjs

          set +e
          npm test > /tmp/npm-test.log 2>&1
          npm_status=$?
          set -e

          if [ "$npm_status" -ne 0 ]; then
            echo '::group::npm test concise failures'
            grep -n -E '^[[:space:]]*not ok |AssertionError|ERR_ASSERTION|^[[:space:]]*(actual|expected|operator|location|failureType):|^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)' /tmp/npm-test.log || true
            echo '::endgroup::'
            exit "$npm_status"
          fi

      - name: Validate release version surfaces
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"version": "0.5.157"' extension/manifest.json
          grep -F '"version": "0.5.157"' extension/package.json
          grep -F 'version = "0.5.157"' native-core/Cargo.toml
          grep -A1 -F 'name = "gptwork-core"' native-core/Cargo.lock | grep -F 'version = "0.5.157"'
          grep -F '#define MyAppVersion "0.5.157"' packaging/windows/GPTWork.iss

      - name: Commit repaired source and release surfaces
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/background.js extension/manifest.json extension/package.json extension/tests/model-verification-authority-ui.test.mjs extension/tests/v05155-work-bootstrap-policy.test.mjs extension/tests/v05156-work-bootstrap-force.test.mjs extension/tests/v05157-work-bootstrap-transaction-authority.test.mjs native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'v0.5.157: route Work bootstrap through transaction authority'
          git push origin HEAD:fix/v0.5.157-work-bootstrap-transaction-authority
