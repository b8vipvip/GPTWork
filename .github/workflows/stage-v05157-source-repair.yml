name: stage-v05157-source-repair

on:
  push:
    branches:
      - fix/v0.5.157-work-bootstrap-transaction-authority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.157-work-bootstrap-transaction-authority
          fetch-depth: 0

      - name: Apply v0.5.157 source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bg_path = Path('extension/background.js')
          bg = bg_path.read_text(encoding='utf-8')

          if "const RUNTIME_CODE_VERSION = '0.5.156';" not in bg:
              raise SystemExit('unexpected background version')

          old_decl = """// One-shot Work bootstrap follows normal Work policy outside verification authority.\nconst workBootstrapTabs = new Set();\n"""
          new_decl = """// Work bootstrap uses the same per-tab verification transaction authority as every\n// catalog probe. There is no parallel bootstrap lock path.\n"""
          if bg.count(old_decl) != 1:
              raise SystemExit('unexpected workBootstrapTabs declaration count')
          bg = bg.replace(old_decl, new_decl)

          anchor = """function verificationTransactionForTab(tabId) {\n  return verificationTransactions.get(Number(tabId)) || null;\n}\n\n"""
          helper = """function verificationTransactionForTab(tabId) {\n  return verificationTransactions.get(Number(tabId)) || null;\n}\n\nfunction workBootstrapModelForTab(tabId) {\n  const policy = effectivePolicyForTabSync(tabId);\n  return normalizeConcreteModelId(policy.lockedModels?.[0])\n    ?? normalizeConcreteModelId(DEFAULT_POLICY.lockedModels?.[0]);\n}\n\nfunction beginWorkBootstrapTransaction(tabId) {\n  const key = Number(tabId);\n  const previous = verificationTransactions.get(key) || null;\n  const model = workBootstrapModelForTab(tabId);\n  if (!model) throw new Error('work_bootstrap_model_unavailable');\n  const transaction = {\n    model,\n    selectorKey: '',\n    label: 'Work bootstrap',\n    startedAt: Date.now(),\n    phase: 'work-bootstrap',\n  };\n  verificationTransactions.set(key, transaction);\n  logRuntime('info', 'verification', 'verification_work_bootstrap_authority_started', {\n    tabId: key,\n    model,\n    replacedModel: previous?.model ?? null,\n  });\n  return {\n    model,\n    restore() {\n      const current = verificationTransactions.get(key);\n      if (current !== transaction) return;\n      if (previous) verificationTransactions.set(key, previous);\n      else verificationTransactions.delete(key);\n      logRuntime('info', 'verification', 'verification_work_bootstrap_authority_restored', {\n        tabId: key,\n        model,\n        restoredModel: previous?.model ?? null,\n      });\n    },\n  };\n}\n\n"""
          if bg.count(anchor) != 1:
              raise SystemExit('verification transaction anchor mismatch')
          bg = bg.replace(anchor, helper)

          lock_pattern = re.compile(
              r"  getLockConfiguration\(tabId\) \{\n.*?\n  \},\n  getVerificationTransaction\(tabId\) \{",
              re.S,
          )
          lock_replacement = """  getLockConfiguration(tabId) {\n    const policy = runtimePolicyForTabSync(tabId);\n    return {\n      lockedModels: policy.lockedModels,\n      allowedReasoningLevels: policy.allowedReasoningLevels,\n      preferredReasoning: currentSettings.preferredReasoning,\n      preserveModel: false,\n      preserveReasoning: false,\n      bypassRewrite: false,\n      forceModel: null,\n      responseVerificationEnabled: currentSettings.networkVerificationEnabled,\n      knownModels: [...sharedKnownModelIds],\n    };\n  },\n  getVerificationTransaction(tabId) {"""
          bg, count = lock_pattern.subn(lock_replacement, bg, count=1)
          if count != 1:
              raise SystemExit('getLockConfiguration replacement failed')

          if bg.count('workBootstrapTabs.add(Number(tabId));') != 2:
              raise SystemExit('unexpected Work bootstrap add count')
          if bg.count('workBootstrapTabs.delete(Number(tabId));') != 2:
              raise SystemExit('unexpected Work bootstrap delete count')
          bg = bg.replace(
              'workBootstrapTabs.add(Number(tabId));',
              'const workBootstrapTransaction = beginWorkBootstrapTransaction(tabId);',
          )
          bg = bg.replace(
              'workBootstrapTabs.delete(Number(tabId));',
              'workBootstrapTransaction.restore();',
          )
          if 'workBootstrapTabs' in bg:
              raise SystemExit('parallel Work bootstrap Set still present')

          old_authority = """            && activationRewrite?.authorityKind === 'normal-policy'\n            && activationRewrite?.requestId\n"""
          new_authority = """            && activationRewrite?.authorityKind === 'verification-transaction'\n            && activationRewrite?.authorityModel === activationTarget\n            && activationRewrite?.requestId\n"""
          if bg.count(old_authority) != 1:
              raise SystemExit('activation authority predicate mismatch')
          bg = bg.replace(old_authority, new_authority)
          bg = bg.replace("source: 'normal_work_policy_request'", "source: 'verification_transaction_work_bootstrap'")
          bg = bg.replace("'normal_work_response_default_model'", "'verification_transaction_work_response_default_model'")

          bg = bg.replace("const RUNTIME_CODE_VERSION = '0.5.156';", "const RUNTIME_CODE_VERSION = '0.5.157';", 1)
          bg_path.write_text(bg, encoding='utf-8')

          for path in [
              Path('extension/manifest.json'),
              Path('extension/package.json'),
              Path('native-core/Cargo.toml'),
              Path('native-core/Cargo.lock'),
              Path('packaging/windows/GPTWork.iss'),
          ]:
              text = path.read_text(encoding='utf-8')
              if '0.5.156' not in text:
                  raise SystemExit(f'no 0.5.156 version surface in {path}')
              path.write_text(text.replace('0.5.156', '0.5.157'), encoding='utf-8')

          for obsolete in [
              Path('extension/tests/v05155-work-bootstrap-policy.test.mjs'),
              Path('extension/tests/v05156-work-bootstrap-force.test.mjs'),
          ]:
              if obsolete.exists():
                  obsolete.unlink()
          PY

          cat > extension/tests/v05157-work-bootstrap-transaction.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import { rewriteConversationPostData } from '../network-evidence.js';

          const background = await readFile(new URL('../background.js', import.meta.url), 'utf8');
          const networkMonitor = await readFile(new URL('../network-monitor.js', import.meta.url), 'utf8');

          test('Work bootstrap uses the proven verification transaction as its only request authority', () => {
            assert.doesNotMatch(background, /workBootstrapTabs/);
            assert.match(background, /function workBootstrapModelForTab\(tabId\)/);
            assert.match(background, /const policy = effectivePolicyForTabSync\(tabId\)/);
            assert.match(background, /normalizeConcreteModelId\(policy\.lockedModels\?\.\[0\]\)/);
            assert.match(background, /normalizeConcreteModelId\(DEFAULT_POLICY\.lockedModels\?\.\[0\]\)/);
            assert.match(background, /function beginWorkBootstrapTransaction\(tabId\)/);
            assert.match(background, /verificationTransactions\.set\(key, transaction\)/);
            assert.match(background, /if \(current !== transaction\) return/);
            assert.match(background, /if \(previous\) verificationTransactions\.set\(key, previous\)/);
            assert.match(background, /else verificationTransactions\.delete\(key\)/);
            assert.equal([...background.matchAll(/const workBootstrapTransaction = beginWorkBootstrapTransaction\(tabId\);/g)].length, 2);
            assert.equal([...background.matchAll(/workBootstrapTransaction\.restore\(\);/g)].length, 2);
          });

          test('normal lock configuration has no parallel Work-bootstrap rewrite path', () => {
            const start = background.indexOf('getLockConfiguration(tabId) {');
            const end = background.indexOf('getVerificationTransaction(tabId)', start);
            assert.ok(start >= 0 && end > start);
            const block = background.slice(start, end);
            assert.match(block, /const policy = runtimePolicyForTabSync\(tabId\)/);
            assert.match(block, /forceModel: null/);
            assert.match(block, /knownModels: \[\.\.\.sharedKnownModelIds\]/);
            assert.doesNotMatch(block, /effectivePolicyForTabSync/);
            assert.doesNotMatch(block, /workBootstrap/);
          });

          test('network monitor turns a verification transaction into terminal Fetch authority', () => {
            const start = networkMonitor.indexOf('effectiveConfiguration(tabId) {');
            const end = networkMonitor.indexOf('async performAttach', start);
            assert.ok(start >= 0 && end > start);
            const block = networkMonitor.slice(start, end);
            assert.match(block, /lockedModels: \[model\]/);
            assert.match(block, /forceModel: model/);
            assert.match(block, /authorityKind: 'verification-transaction'/);
            assert.match(block, /authorityModel: model/);
          });

          test('bootstrap confirmation consumes transaction authority plus exact Work default model', () => {
            assert.match(background, /activationRewrite\?\.authorityKind === 'verification-transaction'/);
            assert.match(background, /activationRewrite\?\.authorityModel === activationTarget/);
            assert.match(background, /activationDefaultModel === activationTarget/);
          });

          test('transaction-forced Work model rewrites visible Chat model to Work transport', () => {
            const rewritten = rewriteConversationPostData(JSON.stringify({
              model: 'gpt-5.6-sol',
              thinking_effort: 'high',
            }), {
              lockedModels: ['gpt-6-astra'],
              knownModels: ['gpt-5.6-sol', 'gpt-6-astra'],
              forceModel: 'gpt-6-astra',
              preserveModel: false,
              preserveReasoning: true,
              allowedReasoningLevels: ['high'],
            });
            assert.equal(rewritten.changed, true);
            assert.equal(rewritten.modelBefore, 'gpt-5.6-sol');
            assert.equal(rewritten.modelAfter, 'gpt-6-astra');
            assert.equal(rewritten.transportModelAfter, 'gpt-6-astra-wm');
            assert.equal(rewritten.reason, 'verification_model_forced');
          });

          test('failed Work discovery remains fail-closed at the account summary', () => {
            assert.match(background, /catalogVerification\?\.workDiscovery\?\.attempted === true/);
            assert.match(background, /catalogVerification\.workDiscovery\.entered !== true/);
            assert.match(background, /finalReason = 'work_model_discovery_incomplete'/);
          });
          EOF

      - name: Validate focused and extension tests
        shell: bash
        run: |
          node --check extension/background.js
          node --test extension/tests/v05157-work-bootstrap-transaction.test.mjs
          cd extension
          npm test

      - name: Commit source repair
        shell: bash
        run: |
          git add extension/background.js extension/manifest.json extension/package.json extension/tests \
            native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v0.5.157: unify Work bootstrap request authority"
          git push origin HEAD:fix/v0.5.157-work-bootstrap-transaction-authority
