name: stage-v05157-source-repair

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v0.5.157-work-bootstrap-transaction-authority
    paths:
      - .github/workflows/stage-v05157-source-repair.yml

permissions:
  contents: write

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.157-work-bootstrap-transaction-authority
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Normalize deterministic repair anchor
        shell: bash
        run: |
          sed -i "s/'        workBootstrapTabs.add(Number(tabId));'/'workBootstrapTabs.add(Number(tabId));'/" .github/scripts/repair-v05157-work-bootstrap.cjs

      - name: Apply single-authority Work bootstrap repair
        run: node .github/scripts/repair-v05157-work-bootstrap.cjs

      - name: Validate repaired source
        working-directory: extension
        run: |
          node --check background.js
          node --test tests/v05155-work-bootstrap-policy.test.mjs tests/v05156-work-bootstrap-force.test.mjs tests/v05157-work-bootstrap-transaction-authority.test.mjs
          npm test

      - name: Commit repaired source and regression tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/background.js extension/tests/v05155-work-bootstrap-policy.test.mjs extension/tests/v05156-work-bootstrap-force.test.mjs extension/tests/v05157-work-bootstrap-transaction-authority.test.mjs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: route Work bootstrap through transaction authority'
          git push origin HEAD:fix/v0.5.157-work-bootstrap-transaction-authority
