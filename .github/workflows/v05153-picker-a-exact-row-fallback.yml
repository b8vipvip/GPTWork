name: v0.5.153 Picker A exact-row repair

on:
  push:
    branches:
      - fix/v0.5.153-picker-a-exact-row-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.153-picker-a-exact-row-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply live-evidence repair
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          content_path = Path('extension/content.js')
          content = content_path.read_text(encoding='utf-8')

          old_pointer_tail = """      if (!element?.isConnected || !visible(element)) return false;\n      await new Promise((resolve) => window.setTimeout(resolve, 160 * attempt));\n    }\n    return false;\n  }\n\n  async function trustedPointer"""
          new_pointer_tail = """      if (!element?.isConnected || !visible(element)) return false;\n      await new Promise((resolve) => window.setTimeout(resolve, 160 * attempt));\n    }\n    // Live v0.5.152 evidence: Chrome's debugger infobar can leave the exact owned\n    // Picker A row geometrically visible while elementFromPoint() returns null for\n    // every trusted-pointer readiness probe. For verification only, retry the SAME\n    // already-owned DOM row through the page event path. This is not a selector,\n    // coordinate, or alternate-row fallback; the catalog row remains sole authority.\n    if (\n      action === 'click'\n      && source === 'verification-model-row'\n      && element?.isConnected\n      && visible(element)\n    ) {\n      pointerTrace('verification_exact_row_synthetic_fallback', {\n        source, target: compactElementProbe(element), href: location.href,\n      });\n      const dispatched = dispatchSyntheticPointer(element, action);\n      if (dispatched) {\n        await new Promise((resolve) => window.setTimeout(resolve, 2000));\n        return true;\n      }\n    }\n    return false;\n  }\n\n  async function trustedPointer"""
          if content.count(old_pointer_tail) != 1:
              raise SystemExit('content.js: modelPickerPointer tail shape changed')
          content = content.replace(old_pointer_tail, new_pointer_tail, 1)

          old_defer_reject = """        const networkDeferredAfterPointerReject = modern.pickerMode === 'A'\n          && (desired === 'gpt-5.5' || desired === 'gpt-5.6-sol')\n          && candidate.isConnected\n          && visible(candidate)\n          && modern.picker?.contains?.(candidate) === true;"""
          new_defer_reject = """        const networkDeferredAfterPointerReject = modern.pickerMode === 'A'\n          && (desired === 'gpt-5.5' || desired === 'gpt-5.6-sol')\n          && observation.model === desired\n          && candidate.isConnected\n          && visible(candidate)\n          && modern.picker?.contains?.(candidate) === true;"""
          if content.count(old_defer_reject) != 1:
              raise SystemExit('content.js: Picker A pointer-reject defer shape changed')
          content = content.replace(old_defer_reject, new_defer_reject, 1)

          old_defer_after_click = """      const networkDeferred = !confirmed\n        && modern.pickerMode === 'A'\n        && (desired === 'gpt-5.5' || desired === 'gpt-5.6-sol');"""
          new_defer_after_click = """      const networkDeferred = !confirmed\n        && modern.pickerMode === 'A'\n        && (desired === 'gpt-5.5' || desired === 'gpt-5.6-sol')\n        && observation.model === desired;"""
          if content.count(old_defer_after_click) != 1:
              raise SystemExit('content.js: Picker A post-click defer shape changed')
          content = content.replace(old_defer_after_click, new_defer_after_click, 1)

          old_comment = """        // Live v0.5.149 evidence shows the redesigned direct Chat list can expose the\n        // exact composer-owned Picker A radio row while Chromium's post-debugger\n        // elementFromPoint readiness gate returns no stable hit. Picker A verification\n        // already owns an explicit network transaction for the same concrete model, so\n        // allow only these two direct-Chat rows to continue to network evidence. Picker B\n        // still requires a real UI selection because it mutates Work's model state."""
          new_comment = """        // Network-only defer is safe only when the page already reports the requested\n        // direct-Chat model. Live v0.5.152 proved that rewriting a Sol request body to\n        // GPT-5.5 does not make the backend serve GPT-5.5. A model-changing turn must\n        // therefore obtain UI acknowledgement from this exact owned row first."""
          if content.count(old_comment) != 1:
              raise SystemExit('content.js: v0.5.150 defer comment shape changed')
          content = content.replace(old_comment, new_comment, 1)
          content_path.write_text(content, encoding='utf-8')

          Path('extension/tests/v05150-picker-a-network-defer.test.mjs').write_text("""import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst content = await readFile(new URL('../content.js', import.meta.url), 'utf8');\nconst background = await readFile(new URL('../background.js', import.meta.url), 'utf8');\n\ntest('Picker A network defer remains available only when the requested model is already page-confirmed', () => {\n  const start = content.indexOf(\"const attempted = await modelPickerPointer(candidate, 'click', 'verification-model-row')\");\n  const end = content.indexOf('// Never keep using the pre-click row as a liveness authority.', start);\n  assert.ok(start >= 0 && end > start);\n  const block = content.slice(start, end);\n  assert.match(block, /networkDeferredAfterPointerReject = modern\\.pickerMode === 'A'/);\n  assert.match(block, /observation\\.model === desired/);\n  assert.match(block, /candidate\\.isConnected/);\n  assert.match(block, /modern\\.picker\\?\\.contains\\?\\.\\(candidate\\) === true/);\n  assert.match(block, /owned_picker_a_row_pointer_hit_test_unavailable/);\n});\n\ntest('Picker B and trusted-pointer ownership stay strict', () => {\n  assert.match(content, /if \\(!networkDeferredAfterPointerReject\\) return \\{ attempted: false/);\n  assert.match(content, /function pointerStillOwnsPoint/);\n  assert.match(content, /hit === element \\|\\| element\\.contains\\?\\.\\(hit\\)/);\n  assert.match(content, /rejected_unstable_hit_test/);\n  assert.match(background, /if \\(selection\\.selectionAttempted !== true && item\\.pickerMode === 'B'/);\n  assert.match(background, /if \\(!transportOnly && selection\\.selectionAttempted !== true\\) throw new Error\\('Model selection control was not activated'\\)/);\n});\n""", encoding='utf-8')

          Path('extension/tests/v05153-picker-a-exact-row-fallback.test.mjs').write_text("""import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst content = await readFile(new URL('../content.js', import.meta.url), 'utf8');\n\ntest('v0.5.153 retries only the already-owned verification row through the synthetic page path', () => {\n  const start = content.indexOf('async function modelPickerPointer');\n  const end = content.indexOf('async function trustedPointer', start);\n  assert.ok(start >= 0 && end > start);\n  const block = content.slice(start, end);\n  assert.match(block, /source === 'verification-model-row'/);\n  assert.match(block, /element\\?\\.isConnected/);\n  assert.match(block, /visible\\(element\\)/);\n  assert.match(block, /verification_exact_row_synthetic_fallback/);\n  assert.match(block, /dispatchSyntheticPointer\\(element, action\\)/);\n});\n\ntest('v0.5.153 never network-defers a model-changing Picker A turn', () => {\n  const start = content.indexOf('async function selectModelForVerification');\n  const end = content.indexOf('async function chooseExact', start);\n  assert.ok(start >= 0 && end > start);\n  const block = content.slice(start, end);\n  const matches = block.match(/observation\\.model === desired/g) || [];\n  assert.ok(matches.length >= 2, 'both pointer-reject and post-click defer gates require page confirmation');\n  assert.match(block, /networkDeferredAfterPointerReject/);\n  assert.match(block, /const networkDeferred = !confirmed/);\n});\n""", encoding='utf-8')

          replace_once('extension/background.js', "const RUNTIME_CODE_VERSION = '0.5.152';", "const RUNTIME_CODE_VERSION = '0.5.153';")
          replace_once('extension/manifest.json', '"version": "0.5.152"', '"version": "0.5.153"')
          replace_once('extension/package.json', '"version": "0.5.152"', '"version": "0.5.153"')
          replace_once('native-core/Cargo.toml', 'version = "0.5.152"', 'version = "0.5.153"')
          replace_once('native-core/Cargo.lock', 'name = "gptwork-core"\nversion = "0.5.152"', 'name = "gptwork-core"\nversion = "0.5.153"')
          replace_once('packaging/windows/GPTWork.iss', '#define MyAppVersion "0.5.152"', '#define MyAppVersion "0.5.153"')
          PY

          rm .github/workflows/v05153-picker-a-exact-row-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.5.153: require exact Picker A model activation'
          git push origin HEAD:fix/v0.5.153-picker-a-exact-row-fallback
