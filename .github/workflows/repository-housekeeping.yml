name: Repository housekeeping

on:
  push:
    branches: [main]
  schedule:
    - cron: '39 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: gptwork-repository-housekeeping
  cancel-in-progress: true

jobs:
  main-policy-audit:
    name: Audit PR-only main changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the main commit is associated with a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "Non-push housekeeping run; PR-only audit not applicable."
            exit 0
          fi
          for attempt in $(seq 1 6); do
            count="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
            if [[ "$count" -ge 1 ]]; then exit 0; fi
            sleep 5
          done
          message="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message // ""')"
          if [[ "$message" =~ ^Merge\ pull\ request\ \#([0-9]+)\ from\  ]]; then
            pr_number="${BASH_REMATCH[1]}"; pr_json="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            merged_at="$(jq -r '.merged_at // ""' <<<"$pr_json")"; base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"; merge_sha="$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")"
            [[ -n "$merged_at" && "$base_ref" == main && "$merge_sha" == "$GITHUB_SHA" ]] && exit 0
          fi
          echo "::error::Direct push to main detected at $GITHUB_SHA. Repository policy requires changes to enter main through a merged pull request."
          exit 1

  prune-stale-branches:
    name: Prune every branch older than 7 days
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete every non-default branch older than 7 days
        shell: bash
        run: |
          set -Eeuo pipefail
          default="${{ github.event.repository.default_branch }}"
          cutoff="$(date -u -d '7 days ago' +%s)"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0; kept=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == HEAD || "$branch" == "$default" ]] && continue
            tip_epoch="$(git log -1 --format=%ct "$ref")"
            tip_date="$(git log -1 --format=%cI "$ref")"
            if (( tip_epoch < cutoff )); then
              echo "DELETE stale branch: $branch (tip=$tip_date)"
              if git push origin --delete "$branch"; then deleted=$((deleted+1)); else echo "::warning::Unable to delete $branch"; kept=$((kept+1)); fi
            else
              echo "KEEP recent branch: $branch (tip=$tip_date)"
              kept=$((kept+1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
          echo "deleted=$deleted kept=$kept"
