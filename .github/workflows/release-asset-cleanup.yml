name: Release Asset Cleanup

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to clean; leave blank to use the checked-out source version
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: gptwork-release-asset-cleanup-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep installers only
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Remove non-installer release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail

          tag="${REQUESTED_TAG:-}"
          if [[ -z "$tag" ]]; then
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' native-core/Cargo.toml | head -n 1)"
            test -n "$version"
            tag="v$version"
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No release exists for $tag; nothing to clean."
            exit 0
          fi

          keep_asset() {
            local name="$1"
            [[ "$name" =~ ^(GPTWork|GPTLock)Setup-x64\.exe$ ]] ||
              [[ "$name" =~ ^(GPTWork|GPTLock)_[0-9]+(\.[0-9]+){1,3}_amd64\.deb$ ]]
          }

          mapfile -t assets < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          removed=0
          kept=0
          for name in "${assets[@]}"; do
            if keep_asset "$name"; then
              echo "keep:   $name"
              kept=$((kept + 1))
              continue
            fi
            echo "remove: $name"
            gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
            removed=$((removed + 1))
          done

          mapfile -t remaining < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for name in "${remaining[@]}"; do
            if ! keep_asset "$name"; then
              echo "Unexpected non-installer release asset remains: $name" >&2
              exit 1
            fi
          done

          echo "Release $tag cleanup complete: kept=$kept removed=$removed"
