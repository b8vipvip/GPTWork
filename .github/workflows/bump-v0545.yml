name: Bump v0.5.45

on:
  push:
    branches:
      - feat/settings-payments-ui-20260906

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-payments-ui-20260906
      - name: Synchronize v0.5.45 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path('extension/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '0.5.44':
              raise SystemExit(f"unexpected manifest version {manifest.get('version')}")
          manifest['version'] = '0.5.45'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = Path('extension/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package.get('version') != '0.5.44':
              raise SystemExit(f"unexpected extension package version {package.get('version')}")
          package['version'] = '0.5.45'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cargo = Path('native-core/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          old = 'name = "gptwork-core"\nversion = "0.5.44"'
          if text.count(old) != 1:
              raise SystemExit('native-core Cargo.toml version anchor missing')
          cargo.write_text(text.replace(old, 'name = "gptwork-core"\nversion = "0.5.45"', 1), encoding='utf-8')

          lock = Path('native-core/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          old = 'name = "gptwork-core"\nversion = "0.5.44"'
          if text.count(old) != 1:
              raise SystemExit('native-core Cargo.lock version anchor missing')
          lock.write_text(text.replace(old, 'name = "gptwork-core"\nversion = "0.5.45"', 1), encoding='utf-8')
          PY
      - name: Commit version bump and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock
          git rm .github/workflows/bump-v0545.yml
          git commit -m 'chore: bump GPTWork to v0.5.45'
          git push origin HEAD:feat/settings-payments-ui-20260906
