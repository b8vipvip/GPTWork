name: Temporary direct updater reconnect fix
on:
  push:
    branches: [fix/update-recovery-core-repair]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-recovery-core-repair
      - name: Replace updater self-message with direct lifecycle call
        shell: python
        run: |
          from pathlib import Path

          p = Path('extension/background.js')
          s = p.read_text()
          old = 'async function initializeAfterCurrentTask() {'
          if old not in s:
              raise SystemExit('initializeAfterCurrentTask declaration not found')
          s = s.replace(old, 'export async function initializeAfterCurrentTask() {', 1)
          p.write_text(s)

          p = Path('extension/background-update.js')
          s = p.read_text()
          anchor = "import { tabFeatureEnabledSync } from './tab-feature-runtime.js';\n"
          if anchor not in s:
              raise SystemExit('updater import anchor not found')
          s = s.replace(anchor, anchor + "import { initializeAfterCurrentTask } from './background.js';\n", 1)
          start = s.index('function extensionRequest(message, chromeApi = globalThis.chrome) {')
          end = s.index('\nasync function runtimeReadiness', start)
          s = s[:start] + s[end+1:]
          old_call = "await extensionRequest({ type: 'GPTLOCK_RECONNECT' }, chromeApi).catch((error) => {\n      logUpdate('warn', 'update_reconnect_after_reload_failed', { error: errorText(error) });\n    });"
          new_call = "await initializeAfterCurrentTask().catch((error) => {\n      logUpdate('warn', 'update_reconnect_after_reload_failed', { error: errorText(error) });\n    });"
          if old_call not in s:
              raise SystemExit('reconnect call not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)

          p = Path('extension/tests/update-recovery-core-repair.test.mjs')
          s = p.read_text()
          s = s.replace("assert.match(updater, /extensionRequest\\(\\{ type: 'GPTLOCK_RECONNECT' \\}/);", "assert.match(updater, /initializeAfterCurrentTask\\(\\)/);\n  assert.doesNotMatch(updater, /runtime\\.sendMessage\\(message/);")
          p.write_text(s)
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-direct-reconnect-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/background.js extension/background-update.js extension/tests/update-recovery-core-repair.test.mjs .github/workflows/tmp-direct-reconnect-fix.yml
          git commit -m "fix: reconnect updater through lifecycle authority"
          git push origin HEAD:fix/update-recovery-core-repair