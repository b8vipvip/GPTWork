name: Apply v0.5.145 ModelPro redesign sync

on:
  push:
    branches:
      - fix/v0.5.145-modelpro-0.1.44-redesign-sync
    paths:
      - .github/workflows/apply-v0.5.145-modelpro-redesign.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply live-validated ModelPro v0.1.44 compatibility
        shell: bash
        run: |
          python .github/apply-v0.5.145.py
          rm .github/apply-v0.5.145.py .github/workflows/apply-v0.5.145-modelpro-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync live-validated ModelPro v0.1.44 redesign compatibility"
          git push origin HEAD:${{ github.ref_name }}
