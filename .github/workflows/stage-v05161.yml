name: Stage v0.5.161 network Work floor

on:
  push:
    branches:
      - fix/v0.5.161-network-work-astra-floor

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch v0.5.161
        shell: python
        run: |
          from pathlib import Path
          import json

          def require_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # Work policy: network-layer Work follows the page model but now has a
          # GPT-6 Astra floor. The product-neutral ModelPro seam is intentionally untouched.
          path = Path('extension/tab-feature-runtime.js')
          text = path.read_text(encoding='utf-8')
          text = require_replace(
              text,
              "import { normalizeConcreteModelId, normalizePolicy } from './policy.js';",
              "import { normalizeConcreteModelId, normalizePolicy, prioritizeModels } from './policy.js';",
              'tab-feature import',
          )
          text = require_replace(
              text,
              "const BASE_WORK_MODELS = Object.freeze(['gpt-6-astra', 'gpt-5.6-sol']);",
              "export const WORK_MODEL_FLOOR = 'gpt-6-astra';\nconst BASE_WORK_MODELS = Object.freeze([WORK_MODEL_FLOOR]);",
              'Work floor constant',
          )
          start = text.index('function isAtLeastSol(model) {')
          end = text.index('function workModels()', start)
          text = text[:start] + """function isAtLeastWorkFloor(model) {
            const normalized = normalizeConcreteModelId(model);
            if (!normalized) return false;
            return prioritizeModels([normalized, WORK_MODEL_FLOOR])[0] === normalized;
          }

          """ + text[end:]
          text = text.replace('.filter(isAtLeastSol)', '.filter(isAtLeastWorkFloor)')
          text = require_replace(
              text,
              "  // Work follows the model selected in ChatGPT. It only raises models below the\n  // product floor to GPT-5.6 Sol; it must never upgrade an already-eligible page\n  // selection (for example GPT-6 Astra -> some other preferred Work model).",
              "  // Work follows the model selected in ChatGPT. It only raises models below the\n  // product floor to GPT-6 Astra; it must never replace an already-eligible page\n  // selection (for example GPT-6.1 Sol stays GPT-6.1 Sol).",
              'Work policy comment',
          )
          text = require_replace(
              text,
              "    // Work follows the current page model. Only selections below GPT-5.6 Sol are\n    // raised to the Work floor; eligible selections keep their exact identity.\n    lockedModels = selected ? [isAtLeastSol(selected) ? selected : 'gpt-5.6-sol'] : [];",
              "    // Work follows the current page model. Only selections below GPT-6 Astra are\n    // raised to the Work floor; eligible selections keep their exact identity.\n    lockedModels = selected ? [isAtLeastWorkFloor(selected) ? selected : WORK_MODEL_FLOOR] : [];",
              'Work policy resolver',
          )
          path.write_text(text, encoding='utf-8')

          # Auto verification: keep Chat UI/Picker A as the visible authority, then seed
          # a network-only Work transport target. No native Work / Picker-B transition
          # is required to validate Work.
          path = Path('extension/background.js')
          text = path.read_text(encoding='utf-8')
          text = require_replace(text, "const RUNTIME_CODE_VERSION = '0.5.160';", "const RUNTIME_CODE_VERSION = '0.5.161';", 'runtime version')
          text = require_replace(
              text,
              "  // Do not enter Work before GPT-5.5. Current ChatGPT changes the model-picker\n  // topology when Work is enabled; field evidence shows GPT-5.5 must be verified\n  // first in Chat mode, then Work is enabled inside verifyAccountCatalogModels()\n  // before rediscovering picker B and continuing with later models.",
              "  // Verify the visible Chat/Picker-A catalog first. Work verification is a\n  // network-layer phase: after Chat A is proven, verifyAccountCatalogModels() arms\n  // the tab-scoped Work policy and seeds Work-transport probes without switching the\n  // page into ChatGPT's native Work UI or depending on Picker B.",
              'autoVerify Work comment',
          )
          block_start = text.index('    // GPT-5.5 must finish before Work activation.')
          block_end = text.index('    // A completed verified turn is already sufficient', block_start)
          new_block = """    // GPT-5.5 finishes in the visible Chat/Picker-A phase. Work verification
            // then uses the same tab-scoped network policy as normal GPTWork use; it does not
            // click or invoke ChatGPT's native Work toggle and does not wait for Picker B.
            if (item.model === 'gpt-5.5') {
              try {
                const featureState = await enableWorkModeForVerification(tabId);
                workActivationPending = featureState?.workModeEnabled === true;
                progress.workDiscovery = {
                  attempted: false,
                  entered: false,
                  reason: workActivationPending ? 'waiting_for_sol_then_network_work' : 'work_runtime_not_enabled',
                };
                logRuntime(workActivationPending ? 'info' : 'warn', 'verification', 'verification_work_mode_armed', {
                  tabId, phase: 'post_gpt_5_5', runtimeEnabled: workActivationPending,
                  source: 'network_work_policy', floorModel: 'gpt-6-astra',
                });
              } catch (error) {
                progress.workDiscovery = { attempted: false, entered: false, reason: 'work_runtime_enable_failed', error: errorText(error) };
                logRuntime('warn', 'verification', 'verification_work_mode_armed', {
                  tabId, phase: 'post_gpt_5_5', runtimeEnabled: false, error: errorText(error),
                });
              }
            }

            // Network-layer Work has GPT-6 Astra as its minimum. Once Chat A's Sol turn
            // is proven, add the Astra Work transport directly to the verification queue.
            // The existing verification transaction is the sole request authority, so the
            // conversation POST is rewritten to gpt-6-astra-wm and response metadata is
            // still required for terminal verification. Picker B is deliberately irrelevant.
            if (item.model === 'gpt-5.6-sol' && workActivationPending) {
              const completedSol = progress.results.at(-1);
              if (completedSol?.verified === true) {
                const networkWorkCatalog = {
                  pickerMode: null,
                  reasoningLevels: [],
                  rows: [{
                    model: 'gpt-6-astra',
                    rawId: 'gpt-6-astra',
                    label: 'GPT-6 Astra',
                    selectorKey: '__work_transport__',
                    pickerMode: null,
                  }],
                };
                const addedFromWork = mergeCatalog(networkWorkCatalog, 'work-network');
                progress.workDiscovery = {
                  attempted: true,
                  entered: true,
                  reason: 'network_work_catalog_seeded',
                  runtimeEnabled: true,
                  source: 'network_work_transport',
                  pickerMode: null,
                  added: addedFromWork,
                  floorModel: 'gpt-6-astra',
                };
                logRuntime('info', 'verification', 'verification_work_mode_transition', {
                  tabId, phase: 'post_gpt_5_6_sol', entered: true,
                  source: 'network_work_transport', reason: 'network_work_catalog_seeded',
                  pickerMode: null, added: addedFromWork, floorModel: 'gpt-6-astra',
                });
                if (addedFromWork) stablePasses = 0;
                await broadcastTabState(tabId);
              } else {
                progress.workDiscovery = {
                  attempted: false,
                  entered: false,
                  reason: 'deferred_until_sol_verified',
                  runtimeEnabled: true,
                  source: 'network_work_policy',
                  floorModel: 'gpt-6-astra',
                };
              }
              workActivationPending = false;
            }

          """
          text = text[:block_start] + new_block + text[block_end:]
          path.write_text(text, encoding='utf-8')

          # Version surfaces.
          for filename in ['extension/package.json', 'extension/manifest.json']:
              p = Path(filename)
              data = json.loads(p.read_text(encoding='utf-8'))
              if data.get('version') != '0.5.160':
                  raise SystemExit(f'{filename}: unexpected version {data.get("version")}')
              data['version'] = '0.5.161'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('native-core/Cargo.toml')
          cargo = p.read_text(encoding='utf-8')
          cargo = require_replace(cargo, 'version = "0.5.160"', 'version = "0.5.161"', 'Cargo.toml version')
          p.write_text(cargo, encoding='utf-8')

          p = Path('native-core/Cargo.lock')
          lock = p.read_text(encoding='utf-8')
          lock = require_replace(lock, 'name = "gptwork-core"\nversion = "0.5.160"', 'name = "gptwork-core"\nversion = "0.5.161"', 'Cargo.lock version')
          p.write_text(lock, encoding='utf-8')

          p = Path('packaging/windows/GPTWork.iss')
          installer = p.read_text(encoding='utf-8')
          installer = require_replace(installer, '#define MyAppVersion "0.5.160"', '#define MyAppVersion "0.5.161"', 'installer version')
          p.write_text(installer, encoding='utf-8')

          # Historical regression tests are kept but updated to assert the new active
          # contract instead of the retired Picker-B bootstrap behavior.
          Path('extension/tests/v05155-work-bootstrap-policy.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          const runtime = await readFile(new URL('../tab-feature-runtime.js', import.meta.url), 'utf8');
          const background = await readFile(new URL('../background.js', import.meta.url), 'utf8');

          test('Work policy has one GPT-6 Astra floor and preserves eligible page models', () => {
            assert.match(runtime, /export const WORK_MODEL_FLOOR = 'gpt-6-astra'/);
            assert.match(runtime, /prioritizeModels\(\[normalized, WORK_MODEL_FLOOR\]\)\[0\] === normalized/);
            assert.match(runtime, /isAtLeastWorkFloor\(selected\) \? selected : WORK_MODEL_FLOOR/);
            assert.doesNotMatch(runtime, /isAtLeastSol\(/);
          });

          test('failed Work discovery cannot be reported as a fully verified account', () => {
            assert.match(background, /catalogVerification\?\.workDiscovery\?\.attempted === true/);
            assert.match(background, /catalogVerification\.workDiscovery\.entered !== true/);
            assert.match(background, /finalReason = 'work_model_discovery_incomplete'/);
          });
          ''', encoding='utf-8')

          Path('extension/tests/v05156-work-bootstrap-force.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import { rewriteConversationPostData } from '../network-evidence.js';

          const background = await readFile(new URL('../background.js', import.meta.url), 'utf8');

          test('verification seeds GPT-6 Astra as a network-only Work transport after Chat A', () => {
            assert.match(background, /model: 'gpt-6-astra'/);
            assert.match(background, /selectorKey: '__work_transport__'/);
            assert.match(background, /reason: 'network_work_catalog_seeded'/);
            assert.match(background, /source: 'network_work_transport'/);
            assert.match(background, /floorModel: 'gpt-6-astra'/);
          });

          test('forced GPT-6 Astra verification model is converted to its Work transport', () => {
            const rewritten = rewriteConversationPostData(JSON.stringify({
              model: 'gpt-5.6-sol',
              thinking_effort: 'high',
            }), {
              lockedModels: ['gpt-6-astra'],
              knownModels: ['gpt-5.6-sol', 'gpt-6-astra'],
              forceModel: 'gpt-6-astra',
              preserveModel: false,
              preserveReasoning: true,
              allowedReasoningLevels: ['high'],
            });
            assert.equal(rewritten.changed, true);
            assert.equal(rewritten.modelBefore, 'gpt-5.6-sol');
            assert.equal(rewritten.modelAfter, 'gpt-6-astra');
            assert.equal(rewritten.transportModelAfter, 'gpt-6-astra-wm');
            assert.equal(rewritten.reason, 'verification_model_forced');
          });
          ''', encoding='utf-8')

          Path('extension/tests/v05157-work-bootstrap-transaction-authority.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          const background = await readFile(new URL('../background.js', import.meta.url), 'utf8');
          const monitor = await readFile(new URL('../network-monitor.js', import.meta.url), 'utf8');

          test('network Work verification keeps verificationTransactions as the terminal request authority', () => {
            const start = background.indexOf('async function verifyAccountCatalogModels');
            const end = background.indexOf('function modelVerificationHistoryRecord', start);
            assert.ok(start >= 0 && end > start);
            const block = background.slice(start, end);
            assert.match(block, /selectorKey: '__work_transport__'/);
            assert.match(block, /verificationTransactions\.set\(Number\(tabId\), \{/);
            assert.doesNotMatch(block, /sendVerificationReasoningProbe\(tabId, 'work-mode-bootstrap'/);
            assert.doesNotMatch(block, /beginWorkBootstrapTransaction\(tabId, 'post-sol-work-activation'\)/);
            assert.match(monitor, /authorityKind: 'verification-transaction'/);
            assert.match(monitor, /forceModel: model/);
          });

          test('network Work phase does not require Picker B to enter', () => {
            assert.match(background, /reason: 'network_work_catalog_seeded'/);
            assert.match(background, /pickerMode: null/);
            assert.match(background, /entered: true/);
          });
          ''', encoding='utf-8')

          p = Path('extension/tests/tab-feature-isolation.test.mjs')
          tests = p.read_text(encoding='utf-8')
          tests = tests.replace("test('v0.5.143 request locking follows the current page model instead of model-list priority'", "test('Work request locking follows the current page model above the GPT-6 Astra floor'")
          tests = require_replace(tests, "/isAtLeastSol\\(selected\\) \\? selected : 'gpt-5\\.6-sol'/", "/isAtLeastWorkFloor\\(selected\\) \\? selected : WORK_MODEL_FLOOR/", 'tab-feature test floor')
          p.write_text(tests, encoding='utf-8')

          p = Path('extension/tests/v05160-modelpro-v0148-causal-viewtrack.test.mjs')
          tests = p.read_text(encoding='utf-8')
          tests = tests.replace("test('v0.5.160 consumes ModelPro v0.1.48 without product-neutral verification policy drift'", "test('current release consumes ModelPro v0.1.48 without product-neutral verification policy drift'")
          tests = require_replace(tests, "assert.equal(manifest.version, '0.5.160');", "assert.equal(manifest.version, '0.5.161');", 'v05160 manifest assertion')
          tests = require_replace(tests, "/const RUNTIME_CODE_VERSION = '0\\.5\\.160';/", "/const RUNTIME_CODE_VERSION = '0\\.5\\.161';/", 'v05160 runtime assertion')
          p.write_text(tests, encoding='utf-8')

          Path('extension/tests/v05161-network-work-astra-floor.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          const read = (path) => readFile(new URL('../' + path, import.meta.url), 'utf8');
          const readRepo = (path) => readFile(new URL('../../' + path, import.meta.url), 'utf8');

          test('v0.5.161 makes GPT-6 Astra the network Work floor', async () => {
            const runtime = await read('tab-feature-runtime.js');
            assert.match(runtime, /WORK_MODEL_FLOOR = 'gpt-6-astra'/);
            assert.match(runtime, /prioritizeModels\(\[normalized, WORK_MODEL_FLOOR\]\)\[0\] === normalized/);
            assert.match(runtime, /isAtLeastWorkFloor\(selected\) \? selected : WORK_MODEL_FLOOR/);
            assert.match(runtime, /\.filter\(isAtLeastWorkFloor\)/);
            assert.doesNotMatch(runtime, /product floor to GPT-5\.6 Sol/);
          });

          test('v0.5.161 verifies Work through GPT-6 Astra transport without native Work or Picker B dependency', async () => {
            const background = await read('background.js');
            const start = background.indexOf('async function verifyAccountCatalogModels');
            const end = background.indexOf('function modelVerificationHistoryRecord', start);
            const block = background.slice(start, end);
            assert.match(block, /model: 'gpt-6-astra'/);
            assert.match(block, /selectorKey: '__work_transport__'/);
            assert.match(block, /source: 'network_work_transport'/);
            assert.match(block, /reason: 'network_work_catalog_seeded'/);
            assert.doesNotMatch(block, /sendVerificationReasoningProbe\(tabId, 'work-mode-bootstrap'/);
            assert.doesNotMatch(block, /beginWorkBootstrapTransaction\(tabId, 'post-sol-work-activation'\)/);
          });

          test('v0.5.161 release surfaces are coherent', async () => {
            const [manifestText, packageText, background, cargoToml, cargoLock, installer] = await Promise.all([
              read('manifest.json'), read('package.json'), read('background.js'),
              readRepo('native-core/Cargo.toml'), readRepo('native-core/Cargo.lock'),
              readRepo('packaging/windows/GPTWork.iss'),
            ]);
            assert.equal(JSON.parse(manifestText).version, '0.5.161');
            assert.equal(JSON.parse(packageText).version, '0.5.161');
            assert.match(background, /RUNTIME_CODE_VERSION = '0\.5\.161'/);
            assert.match(cargoToml, /version = "0\.5\.161"/);
            assert.match(cargoLock, /name = "gptwork-core"\nversion = "0\.5\.161"/);
            assert.match(installer, /#define MyAppVersion "0\.5\.161"/);
          });
          ''', encoding='utf-8')

      - name: Run targeted regression tests
        run: |
          node --check extension/background.js
          node --check extension/tab-feature-runtime.js
          node --test \
            extension/tests/v05155-work-bootstrap-policy.test.mjs \
            extension/tests/v05156-work-bootstrap-force.test.mjs \
            extension/tests/v05157-work-bootstrap-transaction-authority.test.mjs \
            extension/tests/v05160-modelpro-v0148-causal-viewtrack.test.mjs \
            extension/tests/v05161-network-work-astra-floor.test.mjs \
            extension/tests/tab-feature-isolation.test.mjs \
            extension/tests/modelpro-v0145-policy-consumer.test.mjs

      - name: Run full extension test suite
        working-directory: extension
        run: npm test

      - name: Check Rust core
        run: cargo check --locked --manifest-path native-core/Cargo.toml

      - name: Commit staged release
        run: |
          rm .github/workflows/stage-v05161.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.5.161: network Work verification with Astra floor [stage-done]'
          git push origin HEAD:fix/v0.5.161-network-work-astra-floor
