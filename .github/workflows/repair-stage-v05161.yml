name: Repair v0.5.161 staging patch

on:
  push:
    branches:
      - fix/v0.5.161-network-work-astra-floor

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-done]') && !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped regression-test replacement
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/stage-v05161.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          hits = 0
          for i, line in enumerate(lines):
              if "'tab-feature test floor'" not in line:
                  continue
              hits += 1
              lines[i] = r'''          tests = require_replace(tests, "/isAtLeastSol\\(selected\\) \\? selected : 'gpt-5\\.6-sol'/", "/isAtLeastWorkFloor\\(selected\\) \\? selected : WORK_MODEL_FLOOR/", 'tab-feature test floor')''' + '\n'
          if hits != 1:
              raise SystemExit(f'expected one tab-feature floor patch line, got {hits}')
          path.write_text(''.join(lines), encoding='utf-8')
      - name: Commit repair
        run: |
          rm .github/workflows/repair-stage-v05161.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: repair v0.5.161 staging patch [repair-done]'
          git push origin HEAD:fix/v0.5.161-network-work-astra-floor
