name: License Server CI

on:
  push:
    branches: [main]
    paths:
      - 'license-server/**'
      - '.github/workflows/license-server.yml'
  pull_request:
    paths:
      - 'license-server/**'
      - '.github/workflows/license-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-server:
    name: License server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Check JavaScript
        working-directory: license-server
        run: npm run check
      - name: Run smoke tests
        working-directory: license-server
        run: npm test
      - name: Check updater shell scripts
        run: bash -n license-server/scripts/update-server.sh license-server/scripts/install-updater-systemd.sh license-server/scripts/github-fetch.sh
