name: Server CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: License server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        working-directory: license-server
        run: npm run check
      - name: Unit and integration tests
        working-directory: license-server
        run: npm test
