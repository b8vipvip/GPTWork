name: Prepare v0.5.58 update recovery fix

on:
  push:
    branches:
      - fix/v0.5.58-update-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.58-update-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch updater recovery and popup layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) The generic background router must leave updater-owned messages to
          # background-update.js instead of racing it with an "Unsupported" response.
          replace_once(
              'extension/background.js',
              """const TAB_FEATURE_MESSAGE_TYPES = new Set([\n  'GPTWORK_TAB_FEATURE_GET',\n  'GPTWORK_TAB_FEATURE_SET',\n  'GPTWORK_MASTER_STATUS',\n  'GPTWORK_MASTER_SET',\n]);\n\nchrome.runtime.onMessage.addListener((message, sender, sendResponse) => {\n  if (sender.id !== chrome.runtime.id || !message || typeof message.type !== 'string') return false;\n  if (TAB_FEATURE_MESSAGE_TYPES.has(message.type)) return false;\n""",
              """const TAB_FEATURE_MESSAGE_TYPES = new Set([\n  'GPTWORK_TAB_FEATURE_GET',\n  'GPTWORK_TAB_FEATURE_SET',\n  'GPTWORK_MASTER_STATUS',\n  'GPTWORK_MASTER_SET',\n]);\n\n// These messages are owned by background-update.js. The generic router must return\n// false so exactly one listener responds; otherwise Settings can receive the generic\n// \"Unsupported extension message\" error before the updater listener answers.\nconst UPDATE_MESSAGE_TYPES = new Set([\n  'GPTWORK_UPDATE_STATUS_GET',\n  'GPTWORK_UPDATE_CHECK',\n  'GPTWORK_UPDATE_INSTALL',\n]);\n\nchrome.runtime.onMessage.addListener((message, sender, sendResponse) => {\n  if (sender.id !== chrome.runtime.id || !message || typeof message.type !== 'string') return false;\n  if (TAB_FEATURE_MESSAGE_TYPES.has(message.type) || UPDATE_MESSAGE_TYPES.has(message.type)) return false;\n""",
          )

          # 2) During an in-place extension reload the updater restores Master=true while
          # the first background initialization can still be finishing with Master=false.
          # Queue one re-initialize after that old single-flight task settles instead of
          # letting the enable event be swallowed by the old task.
          replace_once(
              'extension/background.js',
              """function initialize() {\n  if (initializeTask) return initializeTask;\n  initializeTask = performInitialize().finally(() => {\n    initializeTask = null;\n  });\n  return initializeTask;\n}\n\nasync function activeTabId() {\n""",
              """function initialize() {\n  if (initializeTask) return initializeTask;\n  initializeTask = performInitialize().finally(() => {\n    initializeTask = null;\n  });\n  return initializeTask;\n}\n\nasync function initializeAfterCurrentTask() {\n  const current = initializeTask;\n  if (current) {\n    try { await current; } catch {}\n  }\n  if (!masterRuntimeEnabled()) return;\n  await initialize();\n}\n\nasync function activeTabId() {\n""",
          )
          replace_once(
              'extension/background.js',
              """  if (localEnabledChanged) {\n    if (masterRuntimeEnabled()) void initialize();\n    else void stopBackgroundRuntime('master_disabled');\n    return;\n  }\n""",
              """  if (localEnabledChanged) {\n    if (masterRuntimeEnabled()) void initializeAfterCurrentTask();\n    else void stopBackgroundRuntime('master_disabled');\n    return;\n  }\n""",
          )

          # 3) If a post-install timeout was persisted but the runtime subsequently became
          # healthy, reconcile the stale error automatically on the next update heartbeat.
          replace_once(
              'extension/background-update.js',
              """async function recoverAfterReload(status, chromeApi = globalThis.chrome) {\n""",
              """function installedRecoveryErrorCanSelfHeal(status) {\n  const detail = String(status?.error || status?.message || '');\n  return status?.phase === 'error'\n    && Boolean(status?.targetVersion)\n    && detail.includes('更新已安装但功能恢复超时');\n}\n\nasync function reconcileInstalledRecovery(currentVersion, status, chromeApi = globalThis.chrome) {\n  if (!installedRecoveryErrorCanSelfHeal(status)) return false;\n  if (compareVersions(currentVersion, status.targetVersion) < 0) return false;\n  const readiness = await runtimeReadiness(status.targetVersion, chromeApi);\n  if (!readiness.ready) return false;\n\n  await recordAttempt(status.targetVersion, 'complete', { nativeVersion: readiness.nativeVersion }, chromeApi);\n  await setUpdateStatus({\n    phase: 'complete', percent: 100, targetVersion: status.targetVersion,\n    nativeVersion: readiness.nativeVersion,\n    message: `更新完成：${status.targetVersion}。本地核心、页面运行时和请求锁定器已自动恢复。`,\n    error: null,\n    failedAt: null,\n    completedAt: new Date().toISOString(),\n  }, chromeApi);\n  await setActionUpdateState({ available: false }, chromeApi);\n  logUpdate('info', 'update_recovery_reconciled', { targetVersion: status.targetVersion, ...readiness });\n  return true;\n}\n\nasync function recoverAfterReload(status, chromeApi = globalThis.chrome) {\n""",
          )
          replace_once(
              'extension/background-update.js',
              """      const status = await getUpdateStatus(chromeApi);\n      if (TRANSIENT_PHASES.has(status?.phase)) {\n        await resumeInterruptedUpdate(chromeApi);\n        return { updateInProgress: true, currentVersion, targetVersion: status.targetVersion ?? null };\n      }\n\n      if (!force) {\n""",
              """      const status = await getUpdateStatus(chromeApi);\n      if (TRANSIENT_PHASES.has(status?.phase)) {\n        await resumeInterruptedUpdate(chromeApi);\n        return { updateInProgress: true, currentVersion, targetVersion: status.targetVersion ?? null };\n      }\n      if (await reconcileInstalledRecovery(currentVersion, status, chromeApi)) {\n        return { updateRecovered: true, currentVersion, targetVersion: status.targetVersion ?? null };\n      }\n\n      if (!force) {\n""",
          )

          # 4) Long recovery diagnostics (including compact JSON) must never expand the
          # action popup beyond its intended 390 px width.
          popup_css = Path('extension/popup-v0513.css')
          css = popup_css.read_text(encoding='utf-8')
          marker = """.actions button small {\n  display: none !important;\n}\n"""
          addition = marker + """\n/* Recovery/error text can contain compact JSON without natural break points. Keep the\n   action popup at its designed width and wrap diagnostic text instead of widening UI. */\nhtml, body {\n  width: 390px !important;\n  max-width: 390px !important;\n  overflow-x: hidden !important;\n}\n\n#appShell,\n.install-help,\n.install-help p {\n  min-width: 0 !important;\n  max-width: 100% !important;\n}\n\n.install-help p {\n  overflow-wrap: anywhere !important;\n  word-break: break-word !important;\n}\n"""
          if css.count(marker) != 1:
              raise SystemExit(f'extension/popup-v0513.css: expected marker once, got {css.count(marker)}')
          popup_css.write_text(css.replace(marker, addition, 1), encoding='utf-8')

          # Regression contracts.
          replace_once(
              'extension/tests/update-single-authority.test.mjs',
              """const updater = fs.readFileSync(new URL('../background-update.js', import.meta.url), 'utf8');\nconst popup = fs.readFileSync(new URL('../popup.js', import.meta.url), 'utf8');\n""",
              """const updater = fs.readFileSync(new URL('../background-update.js', import.meta.url), 'utf8');\nconst background = fs.readFileSync(new URL('../background.js', import.meta.url), 'utf8');\nconst popup = fs.readFileSync(new URL('../popup.js', import.meta.url), 'utf8');\n""",
          )
          replace_once(
              'extension/tests/update-single-authority.test.mjs',
              """test('Windows Setup stages the new extension and never recursively deletes the live extension', () => {\n""",
              """test('generic background router delegates updater-owned runtime messages', () => {\n  assert.match(background, /const UPDATE_MESSAGE_TYPES = new Set/);\n  for (const type of ['GPTWORK_UPDATE_STATUS_GET', 'GPTWORK_UPDATE_CHECK', 'GPTWORK_UPDATE_INSTALL']) {\n    assert.match(background, new RegExp(type));\n  }\n  assert.match(background, /TAB_FEATURE_MESSAGE_TYPES\.has\(message\.type\) \|\| UPDATE_MESSAGE_TYPES\.has\(message\.type\)/);\n}\n\ntest('Windows Setup stages the new extension and never recursively deletes the live extension', () => {\n""",
          )

          replace_once(
              'extension/tests/background-master-gating.test.mjs',
              """  assert.match(background, /let initializeTask = null/);\n  assert.match(background, /if \\(initializeTask\\) return initializeTask/);\n  assert.match(background, /performInitialize\\(\\)\\.finally/);\n});\n""",
              """  assert.match(background, /let initializeTask = null/);\n  assert.match(background, /if \\(initializeTask\\) return initializeTask/);\n  assert.match(background, /performInitialize\\(\\)\\.finally/);\n  assert.match(background, /async function initializeAfterCurrentTask\\(\\)/);\n  assert.match(background, /const current = initializeTask/);\n  assert.match(background, /try \\{ await current; \\} catch \\{\\}/);\n  assert.match(background, /if \\(!masterRuntimeEnabled\\(\\)\\) return;/);\n  assert.match(background, /if \\(masterRuntimeEnabled\\(\\)\\) void initializeAfterCurrentTask\\(\\)/);\n});\n""",
          )

          replace_once(
              'extension/tests/background-update.test.mjs',
              """test('account control refresh re-arms the shared heartbeat alarm instead of self-messaging', async () => {\n""",
              """test('a timed-out installed update self-heals once runtime readiness becomes true', () => {\n  assert.match(source, /function installedRecoveryErrorCanSelfHeal/);\n  assert.match(source, /detail\.includes\\('更新已安装但功能恢复超时'\\)/);\n  assert.match(source, /async function reconcileInstalledRecovery/);\n  assert.match(source, /const readiness = await runtimeReadiness\\(status\.targetVersion, chromeApi\\)/);\n  assert.match(source, /if \\(!readiness\.ready\\) return false/);\n  assert.match(source, /phase: 'complete', percent: 100, targetVersion: status\.targetVersion/);\n  assert.match(source, /await reconcileInstalledRecovery\\(currentVersion, status, chromeApi\\)/);\n});\n\ntest('account control refresh re-arms the shared heartbeat alarm instead of self-messaging', async () => {\n""",
          )

          replace_once(
              'extension/tests/popup-update-center.test.mjs',
              """  assert.match(css, /grid-template-columns:\\s*repeat\\(4,/);\n});\n""",
              """  assert.match(css, /grid-template-columns:\\s*repeat\\(4,/);\n  assert.match(css, /max-width:\\s*390px/);\n  assert.match(css, /overflow-wrap:\\s*anywhere/);\n  assert.match(css, /word-break:\\s*break-word/);\n});\n""",
          )
          PY

          rm .github/workflows/fix-v0558-update-recovery.yml
          git diff --check

      - name: Run focused regression tests
        run: >-
          node --test
          extension/tests/background-master-gating.test.mjs
          extension/tests/background-update.test.mjs
          extension/tests/update-single-authority.test.mjs
          extension/tests/popup-update-center.test.mjs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover updater after in-place reload'
          git push origin HEAD:fix/v0.5.58-update-recovery
