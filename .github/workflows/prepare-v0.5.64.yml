name: Prepare v0.5.64

on:
  push:
    branches: ["release/v0.5.64"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.64
          fetch-depth: 0
      - name: Prepare release commit
        env:
          PREPARE_SCRIPT_B64: ""
        run: |
          echo "$PREPARE_SCRIPT_B64" | base64 -d > "$RUNNER_TEMP/prepare-release.sh"
          bash "$RUNNER_TEMP/prepare-release.sh"
