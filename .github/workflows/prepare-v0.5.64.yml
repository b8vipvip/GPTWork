name: Prepare v0.5.64

on:
  push:
    branches:
      - release/v0.5.64

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.64
          fetch-depth: 0
      - name: Bump synchronized release version
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'extension/manifest.json': ('"version": "0.5.63"', '"version": "0.5.64"'),
              'extension/package.json': ('"version": "0.5.63"', '"version": "0.5.64"'),
              'native-core/Cargo.toml': ('version = "0.5.63"', 'version = "0.5.64"'),
              'native-core/Cargo.lock': ('name = "gptwork-core"\nversion = "0.5.63"', 'name = "gptwork-core"\nversion = "0.5.64"'),
              'packaging/windows/GPTWork.iss': ('#define MyAppVersion "0.5.63"', '#define MyAppVersion "0.5.64"'),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected exactly one version marker, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          Path('docs/releases/v0.5.64.md').write_text('''# GPTWork v0.5.64

## Security

- Complete capability lease Phase B/Phase C across the account service, extension, Native Core, and private engine.
- Make the account service authoritative for entitlement, device admission, browser/extension identity, and admitted window bindings before a protected capability lease is issued.
- Keep the short-lived lease opaque and service-worker-memory-only in the extension; protected private-engine entry points fail closed when the lease is missing or invalid.
- Verify Ed25519 signatures plus issuer, audience, lifetime, feature, device, browser, extension, and window bindings inside the private engine.
- Add a production release gate that blocks private-engine builds when no capability-lease verification key is configured.
- Add safe Ed25519 deployment-key generation and regression coverage without exposing the private signing key.
- Pin the deployed production capability-lease public key into private-engine release builds; the private signing key remains only on the GPTLock account service.

## Deployment

- Production capability-lease issuer is enabled at `https://gptlock.mv3.cn` with a 300-second lease lifetime.
- Release binaries are cryptographically bound to the matching production Ed25519 public key.
''', encoding='utf-8')
          PY
          rm -f .github/workflows/prepare-v0.5.64.yml
          git diff --check
      - name: Commit release preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.5.64'
          git push origin HEAD:release/v0.5.64
