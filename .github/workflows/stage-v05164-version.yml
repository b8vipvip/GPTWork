name: Stage v0.5.164 release surfaces

on:
  push:
    branches: [fix/v0.5.164-update-log-phase-dedup]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.164-update-log-phase-dedup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump release surfaces and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'extension/manifest.json': [('"version": "0.5.163"', '"version": "0.5.164"')],
              'extension/package.json': [('"version": "0.5.163"', '"version": "0.5.164"')],
              'extension/background.js': [("const RUNTIME_CODE_VERSION = '0.5.163';", "const RUNTIME_CODE_VERSION = '0.5.164';")],
              'native-core/Cargo.toml': [('version = "0.5.163"', 'version = "0.5.164"')],
              'native-core/Cargo.lock': [('name = "gptwork-core"\nversion = "0.5.163"', 'name = "gptwork-core"\nversion = "0.5.164"')],
              'packaging/windows/GPTWork.iss': [('#define MyAppVersion "0.5.163"', '#define MyAppVersion "0.5.164"')],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          cd extension
          npm test
      - name: Commit staged release surfaces
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/manifest.json extension/package.json extension/background.js native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          git diff --cached --quiet && exit 0
          git commit -m 'chore: bump release surfaces to v0.5.164 [stage-done]'
          git push origin HEAD:fix/v0.5.164-update-log-phase-dedup
