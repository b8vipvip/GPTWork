name: Repair settings stylesheet route

on:
  push:
    branches:
      - feat/settings-payments-ui-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-payments-ui-20260906
      - name: Patch route and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('license-server/server.mjs')
          source = server.read_text(encoding='utf-8')
          needle = "    if (url.pathname === '/admin-website.css') return staticFile(res, join(PUBLIC,'admin-website.css'));\n"
          replacement = needle + "    if (url.pathname === '/admin-settings.css') return staticFile(res, join(PUBLIC,'admin-settings.css'));\n"
          if "url.pathname === '/admin-settings.css'" not in source:
              if needle not in source:
                  raise SystemExit('admin website CSS route anchor not found')
              source = source.replace(needle, replacement, 1)
              server.write_text(source, encoding='utf-8')

          test_path = Path('license-server/test/admin-navigation-and-legal-publish.test.mjs')
          test_source = test_path.read_text(encoding='utf-8')
          marker = "test('website CMS uses isolated per-field saves while retaining an explicit save-all fallback', () => {"
          block = """test('system settings stylesheet is linked and served by the control-plane server', () => {\n  const html = readFileSync(join(PUBLIC, 'admin-settings.html'), 'utf8');\n  const serverSource = readFileSync(join(ROOT, 'server.mjs'), 'utf8');\n  assert.match(html, /href=\"\\/admin-settings\\.css\"/, 'system settings should load its dedicated stylesheet');\n  assert.match(serverSource, /url\\.pathname === '\\/admin-settings\\.css'/, 'server should expose the dedicated system settings stylesheet');\n});\n\n"""
          if "system settings stylesheet is linked and served" not in test_source:
              if marker not in test_source:
                  raise SystemExit('test insertion anchor not found')
              test_source = test_source.replace(marker, block + marker, 1)
              test_path.write_text(test_source, encoding='utf-8')
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-settings-css-route.yml
          git add license-server/server.mjs license-server/test/admin-navigation-and-legal-publish.test.mjs
          git commit -m "fix: serve system settings stylesheet"
          git push origin HEAD:feat/settings-payments-ui-20260906
