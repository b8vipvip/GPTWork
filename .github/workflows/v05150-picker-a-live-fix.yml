name: v0.5.150 live picker-A fix

on:
  push:
    branches:
      - fix/v0.5.150-picker-a-network-defer

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.150-picker-a-network-defer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch payload
        run: python3 .github/scripts/v05150_live_patch.py
      - name: Validate focused repair
        run: |
          node --check extension/content.js
          node --check extension/background.js
          node --test extension/tests/v05150-picker-a-network-defer.test.mjs
      - name: Commit repaired branch and remove one-shot files
        run: |
          rm -f .github/workflows/v05150-picker-a-live-fix.yml .github/scripts/v05150_live_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: defer owned Picker A hit-test failure to network verification'
          git push origin HEAD:fix/v0.5.150-picker-a-network-defer
