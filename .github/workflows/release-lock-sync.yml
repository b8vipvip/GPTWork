name: Release Lock Sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'native-core/Cargo.toml'
      - 'native-core/Cargo.lock'
      - '.github/workflows/release-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync Cargo.lock package metadata
        run: cargo update --manifest-path native-core/Cargo.toml --workspace
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native-core/Cargo.lock; then
            echo 'Cargo.lock already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.lock
          git commit -m 'release: sync native core lockfile for v0.5.62'
          git push origin HEAD:${{ github.head_ref }}
