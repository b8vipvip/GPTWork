name: Patch PR137 request correlation

on:
  push:
    branches:
      - feat/request-model-history-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/request-model-history-20260906
      - name: Add request IDs to existing evidence telemetry only
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'extension/network-monitor.js',
              """      this.onRewrite?.(tabId, {\n        endpoint,\n        changed: rewrite.changed,""",
              """      this.onRewrite?.(tabId, {\n        endpoint,\n        requestId: params.networkId ? String(params.networkId) : null,\n        changed: rewrite.changed,""",
          )
          replace_once(
              'extension/network-monitor.js',
              """      this.onRewrite?.(tabId, {\n        endpoint,\n        changed: false,\n        reason: 'rewrite_failed_open',""",
              """      this.onRewrite?.(tabId, {\n        endpoint,\n        requestId: params.networkId ? String(params.networkId) : null,\n        changed: false,\n        reason: 'rewrite_failed_open',""",
          )
          replace_once(
              'extension/background.js',
              """    state.lastRewrite = {\n      capturedAt: new Date().toISOString(),\n      endpoint: rewrite.endpoint ?? null,""",
              """    state.lastRewrite = {\n      capturedAt: new Date().toISOString(),\n      endpoint: rewrite.endpoint ?? null,\n      requestId: rewrite.requestId ?? null,""",
          )
          replace_once(
              'extension/background.js',
              """    logRuntime('info', 'network', 'formal_conversation_request_detected', {\n      tabId,\n      model: request.model,""",
              """    logRuntime('info', 'network', 'formal_conversation_request_detected', {\n      tabId,\n      requestId: request.requestId,\n      model: request.model,""",
          )
          replace_once(
              'extension/background.js',
              """    logRuntime(result.verdict === 'verified' ? 'info' : 'warn', 'verification', 'response_evaluated', {\n      tabId,\n      verdict: result.verdict,""",
              """    logRuntime(result.verdict === 'verified' ? 'info' : 'warn', 'verification', 'response_evaluated', {\n      tabId,\n      requestId: evidence?.streamContext?.initialRequestId ?? evidence.requestId ?? null,\n      verdict: result.verdict,""",
          )
          replace_once(
              'extension/background.js',
              """    logRuntime('error', 'verification', 'response_evaluation_failed', {\n      tabId,\n      error: state.lastError,""",
              """    logRuntime('error', 'verification', 'response_evaluation_failed', {\n      tabId,\n      requestId: evidence?.streamContext?.initialRequestId ?? evidence.requestId ?? null,\n      error: state.lastError,""",
          )
          PY
      - name: Commit telemetry correlation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/background.js extension/network-monitor.js
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'feat: correlate request history with CDP request ids'
          git push origin HEAD:feat/request-model-history-20260906
