name: Prepare GPTWork v0.5.58

on:
  push:
    branches:
      - 'release/v0.5.58'

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.58
          fetch-depth: 0
      - name: Bump release version and remove bootstrap workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'extension/manifest.json': ('"version": "0.5.57"', '"version": "0.5.58"'),
              'extension/package.json': ('"version": "0.5.57"', '"version": "0.5.58"'),
              'native-core/Cargo.toml': ('version = "0.5.57"', 'version = "0.5.58"'),
              'native-core/Cargo.lock': ('name = "gptwork-core"\nversion = "0.5.57"', 'name = "gptwork-core"\nversion = "0.5.58"'),
              'packaging/windows/GPTWork.iss': ('#define MyAppVersion "0.5.57"', '#define MyAppVersion "0.5.58"'),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected exactly one {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          manifest = json.loads(Path('extension/manifest.json').read_text(encoding='utf-8'))['version']
          package = json.loads(Path('extension/package.json').read_text(encoding='utf-8'))['version']
          with open('native-core/Cargo.toml', 'rb') as handle:
              cargo = tomllib.load(handle)['package']['version']
          assert manifest == package == cargo == '0.5.58', (manifest, package, cargo)
          lock = Path('native-core/Cargo.lock').read_text(encoding='utf-8')
          assert 'name = "gptwork-core"\nversion = "0.5.58"' in lock
          installer = Path('packaging/windows/GPTWork.iss').read_text(encoding='utf-8')
          assert '#define MyAppVersion "0.5.58"' in installer
          PY
          git rm .github/workflows/release-bump-v0.5.58.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          git commit -m 'Release GPTWork v0.5.58'
          git push origin HEAD:release/v0.5.58
