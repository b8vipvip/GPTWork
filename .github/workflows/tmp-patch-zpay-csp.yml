name: Temporary ZPAY CSP patch

on:
  push:
    branches:
      - fix/zpay-csp-log-export-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zpay-csp-log-export-20260907
      - name: Patch payment handoff CSP
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('license-server/payment-test-system.mjs')
          text = path.read_text(encoding='utf-8')
          old_zpay = "writeHtml(res, 200, html, `default-src 'none'; script-src 'unsafe-inline'; form-action ${new URL(ZPAY_SUBMIT_URL).origin}; base-uri 'none'; frame-ancestors 'none'`);"
          new_zpay = "writeHtml(res, 200, html, `default-src 'none'; script-src 'unsafe-inline'; form-action https:; base-uri 'none'; frame-ancestors 'none'`);"
          old_alipay = "writeHtml(res, 200, page.html, `default-src 'none'; script-src 'unsafe-inline'; form-action ${page.origin}; base-uri 'none'; frame-ancestors 'none'`);"
          new_alipay = "writeHtml(res, 200, page.html, `default-src 'none'; script-src 'unsafe-inline'; form-action https:; base-uri 'none'; frame-ancestors 'none'`);"
          if old_zpay not in text:
              raise SystemExit('ZPAY CSP target not found')
          if old_alipay not in text:
              raise SystemExit('Alipay CSP target not found')
          text = text.replace(old_zpay, new_zpay, 1).replace(old_alipay, new_alipay, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add license-server/payment-test-system.mjs
          git commit -m "fix: allow secure payment gateway form handoff"
          git push origin HEAD:fix/zpay-csp-log-export-20260907
