name: v05156-apply-fix
on:
  push:
    branches:
      - fix/v0.5.156-force-work-bootstrap-transport
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.156-force-work-bootstrap-transport
          fetch-depth: 0
      - name: Apply source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('extension/background.js')
          s = p.read_text(encoding='utf-8')
          old = (
              "    const policy = workBootstrap\n"
              "      ? effectivePolicyForTabSync(tabId)\n"
              "      : runtimePolicyForTabSync(tabId);\n"
              "    return {\n"
              "      lockedModels: policy.lockedModels,\n"
              "      allowedReasoningLevels: policy.allowedReasoningLevels,\n"
              "      preferredReasoning: workBootstrap ? null : currentSettings.preferredReasoning,\n"
              "      preserveModel: false,\n"
              "      preserveReasoning: workBootstrap,\n"
              "      bypassRewrite: false,\n"
              "      forceModel: null,\n"
              "      responseVerificationEnabled: currentSettings.networkVerificationEnabled,\n"
              "      knownModels: [...sharedKnownModelIds],\n"
              "    };\n"
          )
          new = (
              "    const policy = workBootstrap\n"
              "      ? effectivePolicyForTabSync(tabId)\n"
              "      : runtimePolicyForTabSync(tabId);\n"
              "    // The Work bootstrap is not an allow-list pass. It must make one\n"
              "    // concrete Work transport request so ChatGPT enters the Work profile.\n"
              "    // If the tab-feature runtime was rehydrated during an update, fall back\n"
              "    // to the product Work default instead of silently sending the visible\n"
              "    // Chat model unchanged. Ordinary traffic never takes this branch.\n"
              "    const workBootstrapModel = workBootstrap\n"
              "      ? normalizeConcreteModelId(policy.lockedModels?.[0])\n"
              "        ?? normalizeConcreteModelId(DEFAULT_POLICY.lockedModels?.[0])\n"
              "      : null;\n"
              "    return {\n"
              "      lockedModels: workBootstrapModel ? [workBootstrapModel] : policy.lockedModels,\n"
              "      allowedReasoningLevels: policy.allowedReasoningLevels,\n"
              "      preferredReasoning: workBootstrap ? null : currentSettings.preferredReasoning,\n"
              "      preserveModel: false,\n"
              "      preserveReasoning: workBootstrap,\n"
              "      bypassRewrite: false,\n"
              "      forceModel: workBootstrapModel,\n"
              "      responseVerificationEnabled: currentSettings.networkVerificationEnabled,\n"
              "      knownModels: [...new Set([\n"
              "        ...sharedKnownModelIds,\n"
              "        ...(workBootstrapModel ? [workBootstrapModel] : []),\n"
              "      ])],\n"
              "    };\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f'bootstrap config match count={s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count("const RUNTIME_CODE_VERSION = '0.5.155';") != 1:
              raise SystemExit('runtime version match failed')
          s = s.replace("const RUNTIME_CODE_VERSION = '0.5.155';", "const RUNTIME_CODE_VERSION = '0.5.156';", 1)
          p.write_text(s, encoding='utf-8')

          for name in (
              'extension/manifest.json',
              'extension/package.json',
              'native-core/Cargo.toml',
              'native-core/Cargo.lock',
              'packaging/windows/GPTWork.iss',
          ):
              q = Path(name)
              t = q.read_text(encoding='utf-8')
              if '0.5.155' not in t:
                  raise SystemExit(f'{name}: 0.5.155 missing')
              q.write_text(t.replace('0.5.155', '0.5.156'), encoding='utf-8')
          PY
          node --test extension/tests/v05155-work-bootstrap-policy.test.mjs extension/tests/v05156-work-bootstrap-force.test.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v05156-apply-fix.yml
          git add extension/background.js extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss extension/tests/v05156-work-bootstrap-force.test.mjs
          git commit -m "v0.5.156: force Work bootstrap transport"
          git push origin HEAD:fix/v0.5.156-force-work-bootstrap-transport
