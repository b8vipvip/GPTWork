name: Apply v0.5.145 validated redesign chain

on:
  push:
    branches:
      - fix/v0.5.145-chatgpt-redesign-verified-chain
    paths:
      - .github/workflows/apply-v0.5.145-redesign-chain.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply validated redesign chain
        run: bash .github/apply-v0.5.145.sh
