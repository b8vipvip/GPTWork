name: Apply v0.5.145 validated redesign chain

on:
  push:
    branches:
      - fix/v0.5.145-chatgpt-redesign-verified-chain
    paths:
      - .github/workflows/apply-v0.5.145-redesign-chain.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Port live-validated ModelPro redesign chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.request

          def rep(text, old, new, label, count=1):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, count)

          # 1) Page-model evidence: this helper is intentionally shared with ModelPro.
          # Copy the exact live-validated v0.1.44 implementation, then identify the
          # product helper revision independently.
          with urllib.request.urlopen('https://raw.githubusercontent.com/b8vipvip/ModelPro/main/extension/page-model-evidence.js') as r:
              page = r.read().decode('utf-8')
          page = page.replace("version: '1.2.0'", "version: '1.3.0'", 1)
          Path('extension/page-model-evidence.js').write_text(page, encoding='utf-8')

          # 2) Redesigned composer send compatibility, namespaced for GPTWork.
          with urllib.request.urlopen('https://raw.githubusercontent.com/b8vipvip/ModelPro/main/extension/composer-send-compat.js') as r:
              compat = r.read().decode('utf-8')
          compat = compat.replace("const MARKER = 'modelproSendCompat';", "const MARKER = 'gptworkSendCompat';")
          compat = compat.replace('modelproOriginalTestid', 'gptworkOriginalTestid')
          Path('extension/composer-send-compat.js').write_text(compat, encoding='utf-8')

          # 3) Content runtime: recognize the redesigned first-layer Chat pair before
          # treating Select-model as a nested catalog opener; defer only the missing DOM
          # confirmation to terminal network authority.
          p = Path('extension/content.js')
          s = p.read_text(encoding='utf-8')
          anchor = """  function advancedPickerView(picker) {
    return picker?.querySelector?.('[data-testid=\"composer-model-picker-slider-advanced-view\"]') || null;
  }
"""
