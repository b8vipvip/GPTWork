name: Prepare v0.5.46 Release

on:
  push:
    branches:
      - release/v0.5.46-account-commerce
    paths:
      - scripts/prepare-release-v0.5.46.mjs
      - .github/workflows/prepare-release-v0.5.46.yml

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[v0.5.46-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump source versions
        run: node scripts/prepare-release-v0.5.46.mjs
      - name: Refresh Cargo.lock
        working-directory: native-core
        run: cargo check
      - name: Verify version consistency
        run: |
          python - <<'PY'
          import json, pathlib, re, tomllib
          manifest = json.load(open('extension/manifest.json'))['version']
          package = json.load(open('extension/package.json'))['version']
          cargo = tomllib.load(open('native-core/Cargo.toml','rb'))['package']['version']
          lock = pathlib.Path('native-core/Cargo.lock').read_text()
          assert manifest == package == cargo == '0.5.46', (manifest, package, cargo)
          assert re.search(r'name = "gptwork-core"\nversion = "0\.5\.46"', lock)
          PY
      - name: Commit release preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: prepare GPTWork v0.5.46 account commerce [v0.5.46-prepared]'
          git push origin HEAD:${GITHUB_REF_NAME}
