name: Stage v0.5.165 ModelPro v0.1.50 integration

on:
  push:
    branches:
      - fix/v0.5.165-modelpro-v0150-row-backed-catalog

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply ModelPro v0.1.50 row-backed catalog integration
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          content_path = Path('extension/content.js')
          text = content_path.read_text(encoding='utf-8')
          old = "const currentCanJoinCatalog = !modern.picker || modern.rows.length > 0;"
          new = "const currentCanJoinCatalog = candidateCount > 0;"
          if text.count(old) != 1:
              raise SystemExit(f'expected one old currentCanJoinCatalog expression, found {text.count(old)}')
          text = text.replace(old, new)
          old_comment = "The current-page model can supplement legacy/no-picker discovery or a successful\n    // semantic picker result, but it cannot replace a failed owned-picker discovery."
          new_comment = "The current-page model can supplement only a successful row-backed discovery.\n    // Without at least one owned semantic model row there is no selectable account catalog,\n    // so it cannot replace either an absent trigger or a failed picker transaction."
          if old_comment not in text:
              raise SystemExit('expected catalog fallback comment was not found')
          content_path.write_text(text.replace(old_comment, new_comment), encoding='utf-8')

          old_test_path = Path('extension/tests/v05160-modelpro-v0148-causal-viewtrack.test.mjs')
          old_test = old_test_path.read_text(encoding='utf-8')
          old_assertion = r"assert.match(section, /const currentCanJoinCatalog = !modern\.picker \|\| modern\.rows\.length > 0;/);"
          new_assertion = "assert.match(section, /const currentCanJoinCatalog = candidateCount > 0;/);"
          if old_assertion not in old_test:
              raise SystemExit('v0.5.160 fallback invariant assertion was not found')
          old_test = old_test.replace(old_assertion, new_assertion, 1)
          old_test = old_test.replace(
              "test('failed unified picker discovery cannot fabricate a catalog row from the composer summary', async () => {",
              "test('failed or absent picker discovery cannot fabricate a catalog row from the composer summary', async () => {",
              1,
          )
          old_test_path.write_text(old_test, encoding='utf-8')

          def replace_once(path, old_value, new_value, label):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              if data.count(old_value) != 1:
                  raise SystemExit(f'{label}: expected one {old_value!r}, found {data.count(old_value)}')
              p.write_text(data.replace(old_value, new_value, 1), encoding='utf-8')

          replace_once('extension/manifest.json', '"version": "0.5.164"', '"version": "0.5.165"', 'manifest')
          replace_once('extension/package.json', '"version": "0.5.164"', '"version": "0.5.165"', 'extension package')
          replace_once('extension/background.js', "const RUNTIME_CODE_VERSION = '0.5.164';", "const RUNTIME_CODE_VERSION = '0.5.165';", 'background runtime')
          replace_once('native-core/Cargo.toml', 'version = "0.5.164"', 'version = "0.5.165"', 'native Cargo.toml')
          replace_once('native-core/Cargo.lock', 'name = "gptwork-core"\nversion = "0.5.164"', 'name = "gptwork-core"\nversion = "0.5.165"', 'native Cargo.lock')
          replace_once('packaging/windows/GPTWork.iss', '#define MyAppVersion "0.5.164"', '#define MyAppVersion "0.5.165"', 'Windows installer')

          new_test = Path('extension/tests/v05165-modelpro-v0150-row-backed-catalog.test.mjs')
          new_test.write_text(dedent(r'''
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          const r = (path) => readFile(new URL('../' + path, import.meta.url), 'utf8');
          const rr = (path) => readFile(new URL('../../' + path, import.meta.url), 'utf8');

          test('ModelPro v0.1.50 integration requires row-backed account catalog discovery', async () => {
            const content = await r('content.js');
            const start = content.indexOf('async function discoverAccountModelMetadata()');
            const end = content.indexOf('function diagnosticPerformanceSnapshot', start);
            assert.ok(start >= 0 && end > start);
            const section = content.slice(start, end);
            assert.match(section, /const currentCanJoinCatalog = candidateCount > 0;/);
            assert.doesNotMatch(section, /const currentCanJoinCatalog = !modern\.picker \|\| modern\.rows\.length > 0;/);
            assert.match(section, /Without at least one owned semantic model row there is no selectable account catalog/);
            assert.match(section, /candidateCount = modern\.rows\.length;/);
            assert.match(section, /candidateCount = rows\.length;/);
          });

          test('zero-row or absent-trigger discovery cannot synthesize a selectable current-page model', async () => {
            const content = await r('content.js');
            const start = content.indexOf('async function discoverAccountModelMetadata()');
            const end = content.indexOf('function diagnosticPerformanceSnapshot', start);
            const section = content.slice(start, end);
            assert.match(section, /modern\.pickerMode !== 'B' && currentCanJoinCatalog && current\?\.model/);
            assert.doesNotMatch(section, /modern\.pickerMode !== 'B' && current\?\.model && !models\.some/);
          });

          test('v0.5.165 release surfaces are synchronized while the verification-policy seam remains unchanged', async () => {
            const [manifestText, packageText, background, cargoToml, cargoLock, installer, sourceText] = await Promise.all([
              r('manifest.json'), r('package.json'), r('background.js'), rr('native-core/Cargo.toml'),
              rr('native-core/Cargo.lock'), rr('packaging/windows/GPTWork.iss'), r('vendor/modelpro/MODELPRO_SOURCE.json'),
            ]);
            const manifest = JSON.parse(manifestText);
            const pkg = JSON.parse(packageText);
            const source = JSON.parse(sourceText);
            assert.equal(manifest.version, '0.5.165');
            assert.equal(pkg.version, manifest.version);
            assert.match(background, /const RUNTIME_CODE_VERSION = '0\.5\.165';/);
            assert.match(cargoToml, /version = "0\.5\.165"/);
            assert.match(cargoLock, /name = "gptwork-core"\nversion = "0\.5\.165"/);
            assert.match(installer, /#define MyAppVersion "0\.5\.165"/);
            assert.equal(source.version, '0.1.48');
            assert.equal(source.commit, 'e6c53093c726d689065b3c62fb5d8582ebc4ca7c');
            assert.equal(source.blob, '07cffd300731947b9da387b940f8acf1ae830b02');
          });
          ''').lstrip(), encoding='utf-8')
      - name: Test extension policy
        working-directory: extension
        run: npm test
      - name: Commit staged release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-v0.5.165-modelpro-v0150-row-backed-catalog.yml
          git add extension/content.js extension/manifest.json extension/package.json extension/background.js extension/tests/v05160-modelpro-v0148-causal-viewtrack.test.mjs extension/tests/v05165-modelpro-v0150-row-backed-catalog.test.mjs native-core/Cargo.toml native-core/Cargo.lock packaging/windows/GPTWork.iss
          git commit -m "v0.5.165: consume ModelPro v0.1.50 row-backed catalog [stage-done]"
          git push origin HEAD:fix/v0.5.165-modelpro-v0150-row-backed-catalog
