name: One-shot ModelPro v0.1.45 consumer patch

on:
  push:
    branches:
      - refactor/v0.5.149-consume-modelpro-v0.1.45

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v0.5.149-consume-modelpro-v0.1.45
          fetch-depth: 0
      - name: Delegate GPTWork verification policy to ModelPro
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const backgroundPath = 'extension/background.js';
          let background = fs.readFileSync(backgroundPath, 'utf8');

          const importAnchor = "import { ACCOUNT_REFRESH_ALARM } from './account-refresh-scheduler.js';\n";
          const modelProImport = `import {\n  createVerificationCatalog,\n  summarizeVerificationOutcome,\n  createModelVerificationHistoryRecord,\n} from './vendor/modelpro/model-verification.js';\n`;
          if (!background.includes(modelProImport)) {
            if (!background.includes(importAnchor)) throw new Error('background import anchor not found');
            background = background.replace(importAnchor, importAnchor + modelProImport);
          }

          const verifyStartText = 'async function verifyAccountCatalogModels(tabId, state, accountCatalog, { restoreModel = null } = {}) {';
          const mergeMarker = "  mergeCatalog(accountCatalog, 'initial');";
          const verifyStart = background.indexOf(verifyStartText);
          const mergeStart = background.indexOf(mergeMarker, verifyStart);
          if (verifyStart < 0 || mergeStart < 0) throw new Error('verification catalog block markers not found');
          const verificationPolicyAdapter = `${verifyStartText}\n  // ModelPro owns the reusable catalog identity/order/merge policy. GPTWork keeps\n  // browser, Work activation, request interception and response evidence adapters.\n  const catalog = createVerificationCatalog({\n    normalizeModel: normalizeConcreteModelId,\n    onMerged: ({ phase, added, total, reasoningLevels }) => {\n      state.autoVerification.maxAttempts = total;\n      logRuntime('info', 'verification', 'account_model_catalog_merged', {\n        tabId, phase, added, total, reasoningLevels,\n      });\n    },\n  });\n  const { queue, knownKeys, progress } = catalog;\n  state.autoVerification.catalogVerification = progress;\n  const mergeCatalog = catalog.merge;\n  let workActivationPending = false;\n\n`;
          background = background.slice(0, verifyStart) + verificationPolicyAdapter + background.slice(mergeStart);

          const historyStartText = 'function modelVerificationHistoryRecord(tabId, autoVerification) {';
          const historyStart = background.indexOf(historyStartText);
          const persistStart = background.indexOf('async function persistModelVerificationHistory', historyStart);
          if (historyStart < 0 || persistStart < 0) throw new Error('history serializer block markers not found');
          const historyAdapter = `function modelVerificationHistoryRecord(tabId, autoVerification) {\n  return createModelVerificationHistoryRecord(tabId, autoVerification, {\n    reportType: 'gptwork-model-verification-report',\n  });\n}\n\n`;
          background = background.slice(0, historyStart) + historyAdapter + background.slice(persistStart);

          const outcomeStartText = '  const finalOutcome = catalogVerification.total === 0';
          const outcomeStart = background.indexOf(outcomeStartText);
          const stateStart = background.indexOf('\n\n  state.autoVerification.running = false;', outcomeStart);
          if (outcomeStart < 0 || stateStart < 0) throw new Error('verification outcome block markers not found');
          const outcomeAdapter = `  const verificationSummary = summarizeVerificationOutcome(catalogVerification);\n  const finalOutcome = verificationSummary.outcome;\n  const finalReason = verificationSummary.reason;`;
          background = background.slice(0, outcomeStart) + outcomeAdapter + background.slice(stateStart);

          background = background.replace("const RUNTIME_CODE_VERSION = '0.5.148';", "const RUNTIME_CODE_VERSION = '0.5.149';");
          if (!background.includes("const RUNTIME_CODE_VERSION = '0.5.149';")) throw new Error('runtime version marker not updated');
          fs.writeFileSync(backgroundPath, background);

          for (const path of ['extension/manifest.json', 'extension/package.json']) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.version = '0.5.149';
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          }

          const cargoTomlPath = 'native-core/Cargo.toml';
          let cargoToml = fs.readFileSync(cargoTomlPath, 'utf8');
          cargoToml = cargoToml.replace(/version = "0\.5\.148"/, 'version = "0.5.149"');
          if (!cargoToml.includes('version = "0.5.149"')) throw new Error('Cargo.toml version not updated');
          fs.writeFileSync(cargoTomlPath, cargoToml);

          const cargoLockPath = 'native-core/Cargo.lock';
          let cargoLock = fs.readFileSync(cargoLockPath, 'utf8');
          cargoLock = cargoLock.replace(/(name = "gptwork-core"\nversion = ")[^"]+("\n)/, '$10.5.149$2');
          if (!/name = "gptwork-core"\nversion = "0\.5\.149"/.test(cargoLock)) throw new Error('Cargo.lock version not updated');
          fs.writeFileSync(cargoLockPath, cargoLock);

          const installerPath = 'packaging/windows/GPTWork.iss';
          let installer = fs.readFileSync(installerPath, 'utf8');
          installer = installer.replace('#define MyAppVersion "0.5.148"', '#define MyAppVersion "0.5.149"');
          if (!installer.includes('#define MyAppVersion "0.5.149"')) throw new Error('installer version not updated');
          fs.writeFileSync(installerPath, installer);
          NODE
          rm -f .github/workflows/modelpro-v0145-consumer-patch.yml
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consume ModelPro v0.1.45 verification policy"
          git push origin HEAD:refactor/v0.5.149-consume-modelpro-v0.1.45
