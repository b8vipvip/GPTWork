name: Release
# Governed release reuses release-ready artifacts produced by the exact main CI SHA.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gptwork-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Validate version and release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' native-core/Cargo.toml | head -n 1)"
          manifest_version="$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          package_version="$(python -c 'import json; print(json.load(open("extension/package.json"))["version"])')"
          test -n "$version"
          test "$version" = "$manifest_version"
          test "$version" = "$package_version"
          tag="v$version"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match source version $version." >&2
            exit 1
          fi

          should_publish=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_publish=false
          fi

          tag_exists=false
          if tag_commit="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
            tag_exists=true
            if [[ "$should_publish" == "true" && "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Existing unpublished tag $tag points to $tag_commit instead of $GITHUB_SHA." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

  wait-for-ci:
    name: Require successful main CI
    timeout-minutes: 20
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.wait.outputs.ci_run_id }}
    steps:
      - id: wait
        name: Wait for exact-SHA CI and retain its run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 90); do
            run_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20")"
            candidate="$(jq -c '.workflow_runs | sort_by(.created_at,.id) | reverse | .[0] // {}' <<<"$run_json")"
            run_id="$(jq -r '.id // empty' <<<"$candidate")"
            status="$(jq -r '.status // "missing"' <<<"$candidate")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$candidate")"
            echo "CI attempt $attempt: run=${run_id:-missing} status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              echo "CI did not succeed: $conclusion" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for CI on $GITHUB_SHA." >&2
          exit 1

  wait-for-governance:
    name: Require PR-only main governance
    timeout-minutes: 10
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PR-only main governance on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-pr-only-main.sh

  reuse-ci-assets:
    name: Reuse exact-SHA CI release assets
    timeout-minutes: 10
    needs: [metadata, wait-for-ci, wait-for-governance]
    if: >-
      ${{
        needs.metadata.outputs.should_publish == 'true'
        && needs.wait-for-ci.result == 'success'
        && needs.wait-for-governance.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release-ready artifacts from exact CI run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.wait-for-ci.outputs.ci_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CI_RUN_ID"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100")"
          linux_id="$(jq -r '[.artifacts[] | select(.name == "gptwork-linux-release")][0].id // empty' <<<"$artifacts")"
          windows_id="$(jq -r '[.artifacts[] | select(.name == "gptwork-windows-setup")][0].id // empty' <<<"$artifacts")"
          [[ -n "$linux_id" && -n "$windows_id" ]] || {
            echo "Exact-SHA CI run $CI_RUN_ID is missing release-ready artifacts." >&2
            exit 1
          }
          mkdir -p /tmp/ci-assets/linux /tmp/ci-assets/windows
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$linux_id/zip" > /tmp/linux.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$windows_id/zip" > /tmp/windows.zip
          unzip -q /tmp/linux.zip -d /tmp/ci-assets/linux
          unzip -q /tmp/windows.zip -d /tmp/ci-assets/windows

      - name: Verify exact SHA and version provenance
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          linux_prov="$(find /tmp/ci-assets/linux -name release-provenance.json -type f -print -quit)"
          windows_prov="$(find /tmp/ci-assets/windows -name release-provenance.json -type f -print -quit)"
          [[ -n "$linux_prov" && -n "$windows_prov" ]]
          for prov in "$linux_prov" "$windows_prov"; do
            jq -e --arg sha "$GITHUB_SHA" --arg version "$RELEASE_VERSION" \
              '.schema == "gptwork.ci-release-provenance/v1" and .sha == $sha and .version == $version' "$prov" >/dev/null
          done

      - name: Assemble and verify release surface without rebuilding
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          deb="$(find /tmp/ci-assets/linux -type f -name 'GPTWork_*_amd64.deb' -print -quit)"
          core_tar="$(find /tmp/ci-assets/linux -type f -name "GPTWork-core-${RELEASE_VERSION}-linux-x64.tar.gz" -print -quit)"
          extension_zip="$(find /tmp/ci-assets/linux -type f -name "GPTWork-extension-${RELEASE_VERSION}.zip" -print -quit)"
          setup="$(find /tmp/ci-assets/windows -type f -name 'GPTWorkSetup-x64.exe' -print -quit)"
          for file in "$deb" "$core_tar" "$extension_zip" "$setup"; do
            [[ -n "$file" && -s "$file" ]] || { echo "Missing release asset: $file" >&2; exit 1; }
            cp "$file" dist/
          done

          if unzip -Z1 "$extension_zip" | grep -Eq '(^|/)(private-engine|Cargo\.(toml|lock)|[^/]+\.rs)(/|$)'; then
            echo 'Private engine source leaked into extension archive.' >&2
            exit 1
          fi
          entries="$(tar -tzf "$core_tar")"
          grep -qx 'gptwork-core' <<<"$entries"
          grep -qx 'gptwork-engine' <<<"$entries"
          if grep -Eq '(^|/)(private-engine|Cargo\.(toml|lock)|[^/]+\.rs)(/|$)' <<<"$entries"; then
            echo 'Private engine source leaked into Linux core archive.' >&2
            exit 1
          fi
          deb_entries="$(dpkg-deb --contents "$deb")"
          grep -q '/usr/bin/gptwork-engine$' <<<"$deb_entries"
          if grep -Eq 'private-engine|Cargo\.(toml|lock)|\.rs($|[[:space:]])' <<<"$deb_entries"; then
            echo 'Private engine source leaked into Linux deb.' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-ready
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    timeout-minutes: 15
    needs: [metadata, wait-for-ci, wait-for-governance, reuse-ci-assets]
    if: >-
      ${{
        always()
        && needs.metadata.outputs.should_publish == 'true'
        && needs.wait-for-ci.result == 'success'
        && needs.wait-for-governance.result == 'success'
        && needs.reuse-ci-assets.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-ready
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          TAG_EXISTS: ${{ needs.metadata.outputs.tag_exists }}
        run: |
          set -Eeuo pipefail
          tag_arguments=(--target "$GITHUB_SHA")
          if [[ "$TAG_EXISTS" == "true" ]]; then
            tag_arguments=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_arguments[@]}" \
            --generate-notes \
            --title "GPTWork $RELEASE_TAG"