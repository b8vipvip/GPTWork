[package]
name = "gptwork-core"
version = "0.5.46"
edition = "2021"
description = "Cross-platform local policy and verification core for GPTWork"
repository = "https://github.com/b8vipvip/GPTLock"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
