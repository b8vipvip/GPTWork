<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPTWork 运行日志 / Runtime logs</title>
  <link rel="stylesheet" href="diagnostics.css">
  <link rel="stylesheet" href="module-nav.css">
</head>
<body data-gptwork-module="diagnostics">
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">GPTWORK <span id="version"></span></p>
        <h1>运行日志与诊断</h1>
        <p>Runtime logs &amp; diagnostics</p>
      </div>
      <div class="actions">
        <button id="refresh" type="button">刷新 / Refresh</button>
        <button id="export" class="primary" type="button">导出诊断 JSON / Export</button>
        <button id="clear" class="danger" type="button">清空日志 / Clear</button>
      </div>
    </header>

    <section class="privacy">
      <strong>隐私边界 / Privacy boundary</strong>
      <p>日志记录组件状态、响应元数据字段路径、解析结果和错误；不保存提示词、回答正文、Cookie、授权头或令牌。</p>
      <p>Logs contain component state, response-metadata field paths, parser outcomes, and errors—not prompts, answer bodies, cookies, authorization headers, or tokens.</p>
    </section>

    <section class="toolbar" aria-label="日志筛选 / Log filters">
      <label>级别 / Level
        <select id="level">
          <option value="all">全部 / All</option>
          <option value="error">Error</option>
          <option value="warn">Warn</option>
          <option value="info">Info</option>
          <option value="debug">Debug</option>
        </select>
      </label>
      <label>组件 / Component
        <select id="component"><option value="all">全部 / All</option></select>
      </label>
      <label class="search">搜索 / Search
        <input id="search" type="search" placeholder="事件、原因或错误 / Event, reason, or error">
      </label>
      <label>导出范围 / Export
        <select id="exportLimit">
          <option value="100">最近 100 条</option>
          <option value="200">最近 200 条</option>
          <option value="300" selected>最近 300 条</option>
        </select>
      </label>
      <span id="count" class="count">0 条</span>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <section id="logs" class="logs" aria-live="polite"></section>
  </main>
  <script type="module" src="module-nav.js"></script>
  <script type="module" src="diagnostics.js"></script>
</body>
</html>
